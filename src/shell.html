<title>教科书</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a study textbook. Board tabs on top, chapter index (sidebar on wide screens, chips on phones), topic entries that open into a lesson + margin notebook. */
:root{
  --bg:#f4f6f5; --paper:#ffffff; --ink:#1b2430; --muted:#5f6b78; --line:#dce2e0; --soft:#eef2f1;
  --py:#0e7c74; --py-soft:#e2f2ef; --dl:#4b45c4; --dl-soft:#ebeafb; --ml:#b0571b; --ml-soft:#f8ebe0;
  --acc:var(--py); --acc-soft:var(--py-soft);
  --done:#1f8a5b; --done-soft:#e1f2e9; --rev:#b7791f; --rev-soft:#fbf0d9; --todo:#7a8794; --todo-soft:#eef1f4; --today:#c2364b; --today-soft:#fbe6ea;
  --code-bg:#f1f4f3; --note-bg:#fffdf3; --note-line:#efe6bf;
  --display:"Noto Serif SC","Songti SC","STSong",serif; --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --paper:#181f26; --ink:#e5eaee; --muted:#9aa6b2; --line:#2a333d; --soft:#1e262e;
  --py:#45c2b5; --py-soft:#173330; --dl:#9a95ff; --dl-soft:#25244a; --ml:#eb9a5e; --ml-soft:#3a2617;
  --done:#5cc995; --done-soft:#173226; --rev:#e7b65a; --rev-soft:#3a2e15; --todo:#8d99a6; --todo-soft:#232b33; --today:#f07f8f; --today-soft:#3d1d24;
  --code-bg:#11171d; --note-bg:#1f1d14; --note-line:#3b3620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --paper:#181f26; --ink:#e5eaee; --muted:#9aa6b2; --line:#2a333d; --soft:#1e262e;
  --py:#45c2b5; --py-soft:#173330; --dl:#9a95ff; --dl-soft:#25244a; --ml:#eb9a5e; --ml-soft:#3a2617;
  --done:#5cc995; --done-soft:#173226; --rev:#e7b65a; --rev-soft:#3a2e15; --todo:#8d99a6; --todo-soft:#232b33; --today:#f07f8f; --today-soft:#3d1d24;
  --code-bg:#11171d; --note-bg:#1f1d14; --note-line:#3b3620; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7}
body[data-b="py"]{--acc:var(--py);--acc-soft:var(--py-soft)}
body[data-b="dl"]{--acc:var(--dl);--acc-soft:var(--dl-soft)}
body[data-b="ml"]{--acc:var(--ml);--acc-soft:var(--ml-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:grid;gap:6px;padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,44px);margin:0;letter-spacing:.08em}
.brand .sub{color:var(--muted);font-size:14px}
.sync{font-size:12.5px;color:var(--muted)}
.sync b{font-weight:500}
.todaybox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin-top:6px}
.todaybox h2{margin:0;font-size:14px;font-weight:700;color:var(--today);letter-spacing:.04em}
.todaylist{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.bar-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.boards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.board{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:grid;gap:4px;min-width:0}
.board strong{font-family:var(--display);font-size:17px;font-weight:900;letter-spacing:.04em}
.board small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.board .mini{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.board .mini i{display:block;height:100%}
.board[data-k="py"] .mini i{background:var(--py)} .board[data-k="dl"] .mini i{background:var(--dl)} .board[data-k="ml"] .mini i{background:var(--ml)}
.board[aria-selected="true"][data-k="py"]{border-color:var(--py);background:var(--py-soft)}
.board[aria-selected="true"][data-k="dl"]{border-color:var(--dl);background:var(--dl-soft)}
.board[aria-selected="true"][data-k="ml"]{border-color:var(--ml);background:var(--ml-soft)}
.tools{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.search{flex:1 1 200px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}
.layout{display:grid;grid-template-columns:1fr;gap:20px;padding-top:16px}
@media (min-width:960px){.layout{grid-template-columns:240px minmax(0,1fr)}.filters{flex:0 1 auto}}
nav.toc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
nav.toc a{flex:0 0 auto;font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;white-space:nowrap}
nav.toc a .n{color:var(--muted);font-size:11.5px;margin-left:6px;font-variant-numeric:tabular-nums}
@media (min-width:960px){
  nav.toc{flex-direction:column;overflow:visible;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);align-self:start;max-height:calc(100vh - 170px);overflow-y:auto;gap:2px}
  nav.toc a{white-space:normal;border:0;background:none;border-left:2px solid var(--line);border-radius:0;padding:5px 10px}
  nav.toc a:hover{border-left-color:var(--acc);color:var(--acc)}
}
main{min-width:0;display:grid;gap:28px}
.intro{margin:0;color:var(--muted);font-size:14px}
.chapter{display:grid;gap:10px;scroll-margin-top:170px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:2px solid var(--acc);padding-bottom:6px}
.chead h2{font-family:var(--display);font-weight:900;font-size:21px;margin:0;text-wrap:balance}
.chead .src{font-size:12.5px;color:var(--muted)}
.chead .cnt{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:10px;scroll-margin-top:170px}
.topic.is-today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.thead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:11px 14px;cursor:pointer;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left}
.thead:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:10px}
.st{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:3px;white-space:nowrap}
.st-done{color:var(--done);background:var(--done-soft)} .st-review{color:var(--rev);background:var(--rev-soft)} .st-todo{color:var(--todo);background:var(--todo-soft)} .st-today{color:var(--today);background:var(--today-soft)}
.ttl{min-width:0;display:grid;gap:2px}
.ttl b{font-size:16px;font-weight:700}
.ttl .one{font-size:14px;color:var(--muted)}
.meta{display:grid;justify-items:end;gap:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:3px}
.meta .pen{color:var(--acc);font-weight:700}
.tbody{padding:0 14px 14px;display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.tbody[hidden]{display:none}
.lesson{display:grid;gap:10px;min-width:0}
.lesson p{margin:0}
.lesson ul{margin:0;padding-left:1.2em}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;tab-size:4}
pre .cm{color:var(--muted)}
.box{border-radius:8px;padding:8px 12px;font-size:14px}
.box .lb{font-weight:700;font-size:12.5px;letter-spacing:.05em;margin-right:6px}
.box.warn{background:var(--rev-soft)} .box.warn .lb{color:var(--rev)}
.box.try{background:var(--acc-soft)} .box.try .lb{color:var(--acc)}
.notes{display:grid;gap:6px}
.nhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.nhead label{font-weight:700;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{font:inherit;font-size:12.5px;border:0;background:var(--paper);color:var(--muted);padding:3px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-s="done"]{background:var(--done-soft);color:var(--done);font-weight:700}
.seg button[aria-pressed="true"][data-s="review"]{background:var(--rev-soft);color:var(--rev);font-weight:700}
.seg button[aria-pressed="true"][data-s="todo"]{background:var(--todo-soft);color:var(--ink);font-weight:700}
.seg button:focus-visible,.chip:focus-visible,.board:focus-visible,nav.toc a:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.linkbtn{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
textarea.note{font:inherit;font-size:14.5px;line-height:28px;color:var(--ink);width:100%;box-sizing:border-box;min-height:118px;resize:vertical;border:1px solid var(--note-line);border-radius:8px;padding:2px 12px;
  background-color:var(--note-bg);background-image:linear-gradient(transparent 27px,var(--note-line) 27px);background-size:100% 28px;background-attachment:local}
textarea.note:focus{outline:2px solid var(--acc);outline-offset:0}
.nstate{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:20px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:520px){
  .thead{grid-template-columns:auto minmax(0,1fr)}
  .meta{grid-column:2;justify-items:start;display:flex;gap:10px}
  .board strong{font-size:15px}
  .board small span{display:none}
}
@media (prefers-reduced-motion:no-preference){.topic{transition:box-shadow .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>教科书</h1><span class="sub" id="sub">Python · 深度学习 · 机器学习 · 数学基础</span></div>
    <div class="sync" id="sync">笔记：正在连接云端…</div>
    <section class="todaybox" id="todaybox" hidden>
      <h2 id="todayTitle">今天要学</h2>
      <div class="todaylist" id="todaylist"></div>
    </section>
  </header>

  <div class="bar-sticky">
    <div class="boards" role="tablist" aria-label="板块" id="boards"></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="搜索知识点或我的笔记" aria-label="搜索">
      <div class="filters" id="filters" role="group" aria-label="筛选"></div>
    </div>
  </div>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="章节"></nav>
    <main id="main"></main>
  </div>

  <footer>
    <div class="legend">
      <span class="st st-done">已学</span>计划里已经学过的日期
      <span class="st st-today">今天</span>今天的内容
      <span class="st st-todo">未学</span>还没到，适合预习
      <span class="st st-review">要复习</span>你自己标的
    </div>
    <p>状态默认按 50 天冲刺的日程自动判断（11/2 开始，11/16 起重排）。实际进度不一样时，展开知识点在“我的笔记”旁边改状态。笔记和状态登录后保存在云端，手机和电脑都能看到。</p>
  </footer>
</div>

<script>
const BOOK=[];
/*DATA*/
</script>
<script>
(function(){
const YEAR=2026;
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const TODAY=pad(now.getMonth()+1)+"-"+pad(now.getDate());
const TODAY_FULL=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
const dnum=d=>YEAR*10000+parseInt(d.slice(0,2))*100+parseInt(d.slice(3));
const HASH={py:"python",dl:"dl",ml:"ml"};
const ALL=[];BOOK.forEach(b=>b.chapters.forEach(c=>c.topics.forEach(t=>{t.b=b.key;t.ch=c.id;ALL.push(t)})));
const BYID={};ALL.forEach(t=>BYID[t.id]=t);

/* ---------- state: notes + status ---------- */
let S={}; // id -> {n, s}
const LS="textbook-v1";
try{const r=localStorage.getItem(LS);if(r)S=JSON.parse(r)||{}}catch(e){}
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let col=null, cloud="connecting";
const pending={}, timers={};

function auto(t){
  if(!t.d)return "todo";
  const n=dnum(t.d);
  if(n<TODAY_FULL)return "done";
  if(n===TODAY_FULL)return "today";
  return "todo";
}
function status(t){const o=S[t.id]&&S[t.id].s;return o||auto(t)}
const LABEL={done:"已学",today:"今天",todo:"未学",review:"要复习"};
function dateLabel(t){if(!t.d)return "自学";const [m,d]=t.d.split("-");return (+m)+"/"+(+d)}

function setSync(){
  const el=document.getElementById("sync");
  const map={connecting:"笔记：正在连接云端…",cloud:"笔记：自动保存到云端，换设备也能看到",saving:"笔记：保存中…",local:(window.claude&&window.claude.use)?"笔记：云端不可用，暂存在这台设备的浏览器里":"笔记：保存在这台设备的浏览器里（换设备或清除浏览器数据会丢失）",error:"笔记：云端保存失败，已暂存在本机，稍后再改一次会重试"};
  el.textContent=map[cloud]||"";
}
function persist(id){
  cache();
  if(!col){return}
  clearTimeout(timers[id]);
  pending[id]=true;cloud="saving";setSync();
  timers[id]=setTimeout(async()=>{
    const v=S[id]||{};
    try{
      if(!v.n&&!v.s)await col.doc(id).delete();
      else await col.doc(id).set({n:v.n||"",s:v.s||"",t:Date.now()});
      delete pending[id];
      if(!Object.keys(pending).length){cloud="cloud";setSync()}
      const ns=document.querySelector('[data-ns="'+id+'"]');if(ns)ns.textContent="已保存";
    }catch(e){cloud="error";setSync()}
  },700);
}

/* ---------- text ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}
function rich(s){
  const lines=s.split("\n");let out="",list=false,para=[];
  const flush=()=>{if(para.length){out+="<p>"+para.map(inline).join("<br>")+"</p>";para=[]}};
  lines.forEach(l=>{
    if(l.startsWith("- ")){flush();if(!list){out+="<ul>";list=true}out+="<li>"+inline(l.slice(2))+"</li>"}
    else{if(list){out+="</ul>";list=false}para.push(l)}
  });
  flush();if(list)out+="</ul>";return out;
}
function codeHtml(s){return s.split("\n").map(l=>{const e=esc(l);const i=e.indexOf("# ");return i>=0&&!/["']/.test(e.slice(0,i))?e.slice(0,i)+'<span class="cm">'+e.slice(i)+"</span>":e}).join("\n")}

/* ---------- view state ---------- */
let board="py",filter="all",query="";const open=new Set();
try{const v=JSON.parse(localStorage.getItem("textbook-view")||"{}");if(v.board)board=v.board;if(v.filter)filter=v.filter}catch(e){}
function readHash(){const h=(location.hash||"").replace("#","");const k=Object.keys(HASH).find(k=>HASH[k]===h);if(k)board=k}
readHash();
function saveView(){try{localStorage.setItem("textbook-view",JSON.stringify({board,filter}))}catch(e){}}
ALL.forEach(t=>{if(auto(t)==="today")open.add(t.id)});

const FILTERS=[["all","全部"],["today","今天"],["done","已学"],["review","要复习"],["todo","未学"],["notes","有笔记"]];
function match(t){
  const s=status(t);
  if(filter==="notes"&&!(S[t.id]&&S[t.id].n))return false;
  if(filter!=="all"&&filter!=="notes"&&s!==filter)return false;
  if(query){const hay=(t.t+t.one+(t.x||"")+(t.c||"")+(t.s||"")+((S[t.id]&&S[t.id].n)||"")).toLowerCase();if(!hay.includes(query))return false}
  return true;
}

function renderBoards(){
  const el=document.getElementById("boards");el.innerHTML="";
  BOOK.forEach(b=>{
    const ts=ALL.filter(t=>t.b===b.key),dn=ts.filter(t=>status(t)==="done").length;
    const btn=document.createElement("button");btn.className="board";btn.dataset.k=b.key;btn.setAttribute("role","tab");btn.id="board-"+b.key;
    btn.setAttribute("aria-selected",b.key===board?"true":"false");
    btn.innerHTML='<strong></strong><small></small><span class="mini"><i></i></span>';
    btn.children[0].textContent=b.name;
    btn.children[1].innerHTML="已学 "+dn+" / "+ts.length+"<span> 个知识点</span>";
    btn.querySelector("i").style.width=Math.round(dn/ts.length*100)+"%";
    btn.onclick=()=>{board=b.key;saveView();try{history.replaceState(null,"","#"+HASH[b.key])}catch(e){}render();window.scrollTo({top:0})};
    el.appendChild(btn);
  });
}
function renderFilters(){
  const el=document.getElementById("filters");el.innerHTML="";
  FILTERS.forEach(([k,l])=>{
    const c=document.createElement("button");c.className="chip";c.type="button";c.textContent=l;c.setAttribute("aria-pressed",k===filter?"true":"false");
    c.onclick=()=>{filter=k;saveView();render()};el.appendChild(c);
  });
}
function renderToday(){
  const ts=ALL.filter(t=>auto(t)==="today");
  const box=document.getElementById("todaybox"),el=document.getElementById("todaylist");
  let list=ts,title="今天（"+(now.getMonth()+1)+"/"+now.getDate()+"）要学";
  if(!ts.length){
    const fut=ALL.filter(t=>t.d&&dnum(t.d)>TODAY_FULL).sort((a,b)=>dnum(a.d)-dnum(b.d));
    if(fut.length){const d=fut[0].d;list=fut.filter(t=>t.d===d);title="下一次（"+dateLabel(fut[0])+"）要学，可以先预习"}
  }
  if(!list.length){box.hidden=true;return}
  box.hidden=false;document.getElementById("todayTitle").textContent=title;el.innerHTML="";
  const color={py:"var(--py)",dl:"var(--dl)",ml:"var(--ml)"};
  list.forEach(t=>{const c=document.createElement("button");c.className="chip";c.type="button";
    c.innerHTML='<span class="dot"></span>';c.firstChild.style.background=color[t.b];c.appendChild(document.createTextNode(t.t));
    c.onclick=()=>jump(t.id);el.appendChild(c)});
}
function jump(id){
  const t=BYID[id];board=t.b;filter="all";query="";document.getElementById("q").value="";open.add(id);saveView();
  try{history.replaceState(null,"","#"+HASH[t.b])}catch(e){}
  render();const el=document.getElementById("t-"+id);if(el){el.scrollIntoView({block:"start"});const h=el.querySelector(".thead");if(h)h.focus({preventScroll:true})}
}

function topicEl(t){
  const s=status(t),art=document.createElement("article");art.className="topic"+(auto(t)==="today"?" is-today":"");art.id="t-"+t.id;
  const isOpen=open.has(t.id)||!!query;
  const hd=document.createElement("button");hd.className="thead";hd.type="button";hd.setAttribute("aria-expanded",isOpen?"true":"false");hd.setAttribute("aria-controls","b-"+t.id);
  const st=document.createElement("span");st.className="st st-"+s;st.textContent=LABEL[s];
  const tt=document.createElement("span");tt.className="ttl";
  const b=document.createElement("b");b.textContent=t.t;const o=document.createElement("span");o.className="one";o.innerHTML=inline(t.one);tt.append(b,o);
  const mt=document.createElement("span");mt.className="meta";
  const src=document.createElement("span");src.textContent=t.s;
  const dt=document.createElement("span");dt.textContent=t.d?(s==="done"?dateLabel(t)+" 学过":dateLabel(t)+" 学"):"自学补充";
  mt.append(src,dt);
  if(S[t.id]&&S[t.id].n){const p=document.createElement("span");p.className="pen";p.textContent="✎ 有笔记";mt.append(p)}
  hd.append(st,tt,mt);
  hd.onclick=()=>{if(open.has(t.id))open.delete(t.id);else open.add(t.id);const nb=art.querySelector(".tbody");const o2=open.has(t.id)||!!query;nb.hidden=!o2;hd.setAttribute("aria-expanded",o2?"true":"false")};
  const body=document.createElement("div");body.className="tbody";body.id="b-"+t.id;body.hidden=!isOpen;
  const ls=document.createElement("div");ls.className="lesson";
  if(t.x){const d=document.createElement("div");d.innerHTML=rich(t.x);d.style.display="grid";d.style.gap="8px";ls.appendChild(d)}
  if(t.c){const p=document.createElement("pre");p.innerHTML=codeHtml(t.c);ls.appendChild(p)}
  if(t.w){const d=document.createElement("div");d.className="box warn";d.innerHTML='<span class="lb">易错</span>'+inline(t.w);ls.appendChild(d)}
  if(t.q){const d=document.createElement("div");d.className="box try";d.innerHTML='<span class="lb">'+(t.b==="py"?"试一试":"自测")+'</span>'+inline(t.q);ls.appendChild(d)}
  body.appendChild(ls);
  // notes
  const nt=document.createElement("div");nt.className="notes";
  const nh=document.createElement("div");nh.className="nhead";
  const lab=document.createElement("label");lab.htmlFor="n-"+t.id;lab.textContent="我的笔记";
  const ns=document.createElement("span");ns.className="nstate";ns.dataset.ns=t.id;
  const seg=document.createElement("span");seg.className="seg";seg.setAttribute("role","group");seg.setAttribute("aria-label","学习状态");
  const ov=S[t.id]&&S[t.id].s;
  [["done","已学"],["review","要复习"],["todo","未学"]].forEach(([k,l])=>{
    const bt=document.createElement("button");bt.type="button";bt.dataset.s=k;bt.textContent=l;
    const cur=ov||(auto(t)==="today"?"":auto(t));bt.setAttribute("aria-pressed",cur===k?"true":"false");
    bt.onclick=e=>{e.stopPropagation();S[t.id]=Object.assign({},S[t.id]);S[t.id].s=k;if(S[t.id].s===auto(t))delete S[t.id].s;persist(t.id);render(true)};
    seg.appendChild(bt);
  });
  nh.append(lab,ns,seg);
  if(ov){const r=document.createElement("button");r.className="linkbtn";r.type="button";r.textContent="恢复按计划";r.onclick=()=>{delete S[t.id].s;persist(t.id);render(true)};nh.appendChild(r)}
  const ta=document.createElement("textarea");ta.className="note";ta.id="n-"+t.id;ta.placeholder="用自己的话写：它是什么？解决什么问题？举个例子。听课时的疑问也记在这里。";
  ta.value=(S[t.id]&&S[t.id].n)||"";
  ta.oninput=()=>{S[t.id]=Object.assign({},S[t.id],{n:ta.value});if(!ta.value)delete S[t.id].n;ns.textContent=col?"保存中…":"已暂存在本机";persist(t.id)};
  ta.onblur=()=>{const p=art.querySelector(".pen");const has=!!ta.value;if(has&&!p){const x=document.createElement("span");x.className="pen";x.textContent="✎ 有笔记";mt.append(x)}else if(!has&&p)p.remove()};
  nt.append(nh,ta);body.appendChild(nt);
  art.append(hd,body);return art;
}

function render(keepScroll){
  const y=window.scrollY;
  const active=document.activeElement&&document.activeElement.id;
  document.body.dataset.b=board;
  renderBoards();renderFilters();renderToday();
  const B=BOOK.find(b=>b.key===board);
  const toc=document.getElementById("toc"),main=document.getElementById("main");toc.innerHTML="";main.innerHTML="";
  const intro=document.createElement("p");intro.className="intro";intro.textContent=B.full+"。"+B.intro;main.appendChild(intro);
  let shown=0;
  B.chapters.forEach(c=>{
    const ts=c.topics.filter(match);
    const dn=c.topics.filter(t=>status(t)==="done").length;
    const a=document.createElement("a");a.href="#"+HASH[board];a.textContent=c.t;const n=document.createElement("span");n.className="n";n.textContent=dn+"/"+c.topics.length;a.appendChild(n);
    a.onclick=e=>{e.preventDefault();const el=document.getElementById("c-"+c.id);if(el)el.scrollIntoView({block:"start"})};
    toc.appendChild(a);
    if(!ts.length)return;
    shown+=ts.length;
    const sec=document.createElement("section");sec.className="chapter";sec.id="c-"+c.id;
    const h=document.createElement("div");h.className="chead";h.innerHTML="<h2></h2><span class='src'></span><span class='cnt'></span>";
    h.children[0].textContent=c.t;h.children[1].textContent=c.s;h.children[2].textContent="已学 "+dn+" / "+c.topics.length;
    sec.appendChild(h);ts.forEach(t=>sec.appendChild(topicEl(t)));main.appendChild(sec);
  });
  if(!shown){const p=document.createElement("p");p.className="empty";p.textContent=query?"没有找到包含“"+query+"”的知识点，换个词试试。":"这个板块没有符合筛选条件的知识点。";main.appendChild(p)}
  if(keepScroll)window.scrollTo(0,y);
  if(active){const el=document.getElementById(active);if(el&&el!==document.body){el.focus({preventScroll:true});if(el.tagName==="TEXTAREA"){const L=el.value.length;try{el.setSelectionRange(L,L)}catch(e){}}}}
}

document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
window.addEventListener("hashchange",()=>{readHash();render()});
if(!window.claude||!window.claude.use){cloud="local"}
render();setSync();

/* ---------- cloud ---------- */
(async()=>{
  const fail=setTimeout(()=>{if(cloud==="connecting"){cloud="local";setSync()}},10000);
  try{
    if(!window.claude||!window.claude.use){clearTimeout(fail);return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){clearTimeout(fail);cloud="local";setSync();return}
    const uid=await user.id();
    if(!uid){clearTimeout(fail);cloud="local";setSync();return}
    col=db.collection("data/users/"+uid);
    let first=true;
    col.limit(1000).onSnapshot(snap=>{
      clearTimeout(fail);
      const before=JSON.stringify(S);const remote={};snap.docs.forEach(d=>{const v=d.data()||{};remote[d.id]={n:v.n||"",s:v.s||""}});
      if(first&&!snap.metadata.fromCache){
        first=false;
        // push local-only notes (written before cloud was reachable) up once
        Object.keys(S).forEach(id=>{if(!remote[id]&&BYID[id]&&(S[id].n||S[id].s))persist(id)});
      }
      Object.keys(remote).forEach(id=>{
        if(pending[id])return;
        const ta=document.getElementById("n-"+id);
        if(ta&&document.activeElement===ta)return;
        const r=remote[id],o={};if(r.n)o.n=r.n;if(r.s)o.s=r.s;S[id]=Object.assign(S[id]||{},o);
        if(!r.n)delete S[id].n;if(!r.s)delete S[id].s;
      });
      const after=JSON.stringify(S);
      cache();
      if(!Object.keys(pending).length){cloud="cloud";setSync()}
      if(after!==before)render(true);
    },err=>{clearTimeout(fail);col=null;cloud="local";setSync()});
  }catch(e){clearTimeout(fail);cloud="local";setSync()}
})();
})();
</script>
