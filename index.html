D("dl-deeper",{a:"要描述“一只猫”，一层网络得一次性从像素直接跳到“猫”，很难；多层网络可以分工：第一层找边缘，第二层把边缘拼成眼睛耳朵，第三层把眼睛耳朵拼成猫脸。每层的任务都简单了。",
s:["深网络把复杂问题拆成多个简单的小步骤，逐层抽象。","同样的表达能力，深而窄的网络比浅而宽的网络需要的参数少得多。","参数少，需要的训练数据也相对少，不容易过拟合。","但越深越难训练：梯度消失、训练慢。所以需要 ReLU、He 初始化、Batch Norm、残差连接这些技巧配合。"],
ex:"鱼书比较：处理 5×5 区域\n一层 5×5 卷积：25 个参数\n两层 3×3 卷积（感受野也是 5×5）：9 + 9 = 18 个参数\n参数更少，中间还多了一次 ReLU，表达能力更强。"});
D("dl-gpu",{a:"CPU 像几位数学教授，每人什么题都会，但一次只能做几道；GPU 像几千个小学生，每人只会算乘加，但几千人同时算。深度学习要做的恰好是海量的简单乘加，所以小学生军团赢了。",
s:["神经网络的计算大部分是矩阵乘法，每个元素的计算互不依赖，可以并行。","GPU 有几千个核心，同时算成千上万个乘加。","训练一个大网络，CPU 要几周，GPU 可能几小时。","数据太大、模型太大时，用多块 GPU 甚至多台机器一起训练（分布式训练）。","还可以用 16 位浮点数代替 32 位，算得更快、显存更省。"],
ex:"一次 1000×1000 的矩阵乘法要做 10 亿次乘加\nCPU：几个核心，每个核心依次算\nGPU：几千个核心同时算，每个只负责一小块\n经验上，同一个 CNN 在 GPU 上训练通常比 CPU 快几十倍。"});
D("dl-detect",{a:"分类只回答“图里有没有猫”；检测还要用笔把每只猫圈出来。YOLO 的做法像把图片画上网格，每个格子负责报告“我这里有没有物体中心、框多大、是什么”。",
s:["输出不只是类别，还有框：中心 (bx, by)、宽 bw、高 bh，以及“有物体”的置信度。","YOLO：把图切成 S×S 的网格，每个格子预测几个框，整张图一次前向就全部出来，所以快。","IoU（交并比）= 两个框交集面积 / 并集面积，用来衡量预测框和真实框有多接近，常把 IoU ≥ 0.5 算“对”。","NMS（非极大值抑制）：同一个物体常被预测出好几个框。保留置信度最高的那个，把和它 IoU 很大的其他框删掉。","锚框（anchor box）：每个格子预设几种形状（高瘦的给人，矮宽的给车），一格可以检测多个物体。"],
ex:"真实框：(0,0) 到 (4,4)，面积 16\n预测框：(2,2) 到 (6,6)，面积 16\n交集：(2,2) 到 (4,4)，面积 4\n并集：16 + 16 − 4 = 28\nIoU = 4 / 28 ≈ 0.14，不合格\nNMS：三个框置信度 0.9、0.8、0.6，若 0.8 的框与 0.9 的 IoU = 0.7 就删掉。"});
D("dl-unet",{a:"给一张照片做“涂色本”：每个像素都要涂上它属于什么（人、路、天空）。U-Net 先把图片缩小来看清“这是什么”，再放大回原尺寸来画准“边界在哪”，放大时把缩小前的细节照片拿出来对照。",
s:["语义分割：输出和输入一样大，每个像素一个类别。","编码器（左半边 U）：卷积 + 池化，尺寸变小、通道变多，理解“是什么”。","解码器（右半边 U）：转置卷积把尺寸放大回去，恢复“在哪里”。","跳跃连接：把编码器同一尺寸的特征图直接拼到解码器上，补回下采样丢掉的细节，边界更清晰。","最后用 1×1 卷积把通道数变成类别数，每个像素做 softmax。"],
ex:"输入 (3, 256, 256)\n编码：256 → 128 → 64 → 32（通道 64 → 128 → 256 → 512）\n解码：32 → 64 → 128 → 256，每步拼上编码器同尺寸的特征\n输出 (类别数, 256, 256)，比如 (3, 256, 256) 表示每个像素属于“背景 / 道路 / 车”的分数。"});
D("dl-face",{a:"公司门禁不可能每来一个新员工就重新训练一次网络。做法是：网络只学会把一张脸变成一串“身份证号”（向量），同一个人不同照片的号码很接近，不同人的号码差很远。来了新人，只要存一张照片的号码就行。",
s:["人脸验证：这两张照片是不是同一个人？人脸识别：这是数据库里的谁？","孪生网络：同一个网络把两张脸分别编码成 128 维向量 f(x₁)、f(x₂)，算它们的距离。距离小于阈值就是同一个人。","三元组损失：每次取三张图，锚点 A、同一人 P、不同人 N。","要求 ‖f(A) − f(P)‖² + α ≤ ‖f(A) − f(N)‖²，α 是间隔，逼网络把不同的人推得更远。","训练时要挑“难”的三元组（长得像的不同人），否则太容易，学不到东西。"],
ex:"α = 0.2\nd(A, P) = 0.5，d(A, N) = 0.6\n损失 = max(0.5 − 0.6 + 0.2, 0) = 0.1 > 0，还要继续拉开\nd(A, P) = 0.3，d(A, N) = 0.9\n损失 = max(0.3 − 0.9 + 0.2, 0) = 0，已满足"});
D("dl-style",{a:"让一个画家用梵高的笔触画你家的照片：照片决定“画了什么”（内容），梵高决定“怎么画”（风格）。神经网络用不同层的特征分别衡量这两件事。",
s:["拿一个训练好的 CNN（如 VGG），不训练它，只用它来提取特征。","内容损失：生成图和内容图在某个中间层的特征图要接近。","风格损失：生成图和风格图在多层的 Gram 矩阵（通道两两之间的相关性）要接近。Gram 矩阵描述“哪些纹理常一起出现”，不管它们在哪里。","总损失 = α × 内容损失 + β × 风格损失。","从随机噪声（或内容图）开始，用梯度下降改的是生成图片的像素，不是网络权重。"],
ex:"某层特征图有 3 个通道，每个通道拉平成向量 a₁、a₂、a₃\nGram 矩阵 G[i][j] = aᵢ · aⱼ，是一个 3×3 矩阵\n若 G[1][2] 很大，说明“通道 1 激活的地方通道 2 也常激活”，比如“蓝色”总和“漩涡笔触”一起出现。"});
D("dl-ortho",{a:"老式电视有几个旋钮：一个只调上下，一个只调左右，一个只调大小。画面偏左就拧左右那个，很快就调好。如果一个旋钮同时改上下、左右和亮度，你永远调不准。",
s:["机器学习项目要依次达成四个目标，每个目标有自己专门的“旋钮”。","① 训练集表现好 → 更大的网络、换 Adam。","② 开发集表现好 → 正则化、更多训练数据。","③ 测试集表现好 → 更大的开发集。","④ 真实世界表现好 → 改开发集或改代价函数。","早停不够正交：它同时影响①和②，所以吴恩达不太推荐。"],
ex:"训练准确率 70%，开发准确率 68% → 问题在①，拧“更大网络”\n训练 98%，开发 80% → 问题在②，拧“正则化 / 更多数据”\n开发 97%，用户反馈很差 → 问题在④，开发集不能代表真实数据，要换开发集。"});
D("dl-metric",{a:"招人时如果同时看学历、经验、面试分、薪资要求四个数，很难拍板。先定一个综合分，最高的那个就录取，决策快得多。",
s:["精确率 P：预测为正的里面有多少是真的正。","召回率 R：真正的正样本里你找回了多少。","两个数经常一个高一个低，没法直接比较模型。","F1 = 2PR / (P + R)，一个数综合两者。","也可以用“满足指标 + 优化指标”：例如运行时间 ≤ 100 毫秒（满足即可），在这个前提下准确率越高越好（优化）。"],
ex:"模型 A：P = 95%，R = 90% → F1 = 2×0.95×0.90/1.85 ≈ 92.4%\n模型 B：P = 98%，R = 85% → F1 = 2×0.98×0.85/1.83 ≈ 91.0%\n选 A。"});
D("dl-split",{a:"开发集是射箭的靶子。如果平时对着一个靶子练，比赛时靶子却放在另一个地方，练得再准也没用。开发集和测试集必须是同一个靶子，而且要放在你真正要射的位置。",
s:["训练集：用来学参数。开发集（验证集）：用来比较模型、调超参数。测试集：最后无偏地评估一次。","开发集和测试集要来自同一分布。","它们要反映你将来真正会遇到的数据。","数据少（几千条）时可以 60/20/20；数据很多（几百万）时 98/1/1 就够了，开发集、测试集有一万条就能可靠评估。","目标不对时要及时换：比如开发集里全是高清图，但用户上传的都是模糊图。"],
ex:"100 万张图：训练 980000，开发 10000，测试 10000\n错误做法：开发集用美国的用户数据，测试集用印度的\n正确做法：把所有地区的数据混在一起，再随机分到开发集和测试集。"});
D("dl-human",{a:"考试满分 100，但题目本身有错，最厉害的人也只能考 99。你考了 92，真正能努力补回来的只有 7 分，不是 8 分。人类水平就是用来估计这个“最高可能分”的。",
s:["贝叶斯误差：理论上最低的可能误差（有些图片连人都看不清）。","用人类水平（最好用专家团队的水平）来近似它。","可避免偏差 = 训练误差 − 人类误差。大说明模型还没学好，用更大的网络、训练更久。","方差 = 开发误差 − 训练误差。大说明过拟合，用正则化、更多数据。","哪个大就先解决哪个。"],
ex:"情况 1：人 1%，训练 8%，开发 10%\n可避免偏差 7%，方差 2% → 先降偏差\n情况 2：人 7.5%，训练 8%，开发 10%\n可避免偏差 0.5%，方差 2% → 先降方差\n同样的训练和开发误差，结论完全相反。"});
D("dl-erran",{a:"医生不会对所有病人用同一种药，而是先查病因：100 个病人里 50 个是细菌感染、5 个是过敏，那先研究抗生素更值得。误差分析就是给模型的错误“查病因”。",
s:["从开发集里随机抽 100 个分错的样本。","建一张表，人工一个个看，记下每个错误的原因（比如狗被认成猫、图片模糊、滤镜）。","统计每种原因占多少比例。","比例就是这个方向的“天花板”：只占 5% 的问题，修好了最多也只能减少 5% 的错误。","错误标签：如果标注本身错了，也算一列。占比大就值得花时间修正开发集的标签，并且修开发集时测试集也要一起修。"],
ex:"开发误差 10%，抽 100 个错误样本：\n狗被认成猫 8 个，大型猫科 43 个，模糊图片 61 个（一张图可以有多个原因）\n修好“狗”：误差最多从 10% 降到 9.2%\n修好“模糊”：误差最多降到 3.9% → 优先处理模糊图片"});
D("dl-mismatch",{a:"你在明亮的健身房里练投篮练得很准，比赛却在昏暗的露天球场。练得不错，但环境变了，所以失手。要区分是“没练好”还是“换了场地”。",
s:["训练数据（网上高清图）多，但真实数据（手机拍的）少。开发集和测试集要用真实数据。","此时开发误差高，可能是方差，也可能是数据分布不同。","从训练集里切一部分出来，叫“训练-开发集”，它和训练集同分布，但不参与训练。","训练误差 → 训练-开发误差的差距：方差。","训练-开发误差 → 开发误差的差距：数据不匹配。","解决不匹配：人工看看两种数据差在哪，收集更像真实数据的训练数据，或者人工合成（比如给干净语音加上车内噪声）。"],
ex:"训练 1%，训练-开发 9%，开发 10% → 主要是方差问题\n训练 1%，训练-开发 1.5%，开发 10% → 主要是数据不匹配"});
D("dl-multitask",{a:"迁移学习：学过钢琴的人学电子琴很快，手指技巧可以直接搬过去。多任务学习：一个学生同时学语文、英语、历史，阅读能力在三门课里互相促进。",
s:["迁移学习：先在任务 A（数据多，如 ImageNet）上训练，再把网络拿到任务 B（数据少，如 X 光片）上，换掉最后一层继续训练。","什么时候有用：A 和 B 输入类型相同；A 的数据比 B 多得多；A 学到的低层特征对 B 有帮助。","多任务学习：一个网络有多个输出，同时完成几个任务，比如一张图同时判断“有没有行人、车、红绿灯、停车标志”。","损失 = 各任务损失之和，某张图没标某一项时那一项就不算。","多任务学习适合任务之间共享很多低层特征、且各任务数据量相近的情况。"],
ex:"自动驾驶一张图输出 4 个数：y = [行人 1, 车 1, 停车标志 0, 红绿灯 1]\n用 4 个 sigmoid 输出（不是 softmax，因为可以同时有多个）\n损失 = 4 个二分类交叉熵相加\n比训练 4 个独立网络效果更好，因为“认边缘、认形状”的底层是共用的。"});
D("dl-e2e",{a:"从北京去上海：传统做法是先坐车到机场、再坐飞机、再坐地铁，每段都要人安排好；端到端是直接坐一趟直达车，中间怎么走让它自己决定。但直达车必须有足够多的线路数据才能修起来。",
s:["传统流水线：语音 → 提取特征 → 音素 → 单词 → 句子，每一步人工设计。","端到端：语音 → 句子，一个网络直接学。","优点：让数据说话，不受人为设计的限制；不用设计中间步骤。","缺点：需要海量的 (输入, 输出) 数据；丢掉了人工积累的有用知识。","数据不够时，把任务拆成两步往往更好，比如门禁：先找到脸在哪，再识别是谁。"],
ex:"语音识别：数据 3000 小时 → 传统流水线更好\n数据 10 万小时 → 端到端更好\n门禁：人站在远处，直接从整张图判断身份很难；先裁出人脸（第一步数据很多），再识别（第二步也有很多数据）效果更好。"});
D("pt-tensor",{a:"张量就是 NumPy 数组的升级版：长得一样、用法几乎一样，但多了两个本事：能放到 GPU 上算，能自动记住“我是怎么算出来的”以便求导。",
s:["创建：`torch.tensor([1., 2.])`、`torch.zeros(3, 4)`、`torch.randn(2, 3)`。","和 NumPy 互转：`torch.from_numpy(a)`、`t.numpy()`。","常用属性：`t.shape`、`t.dtype`、`t.device`。","运算和 NumPy 一样：`+ - * /`、`@` 矩阵乘法、`t.sum()`、`t.mean(dim=0)`。","注意：NumPy 里叫 axis，PyTorch 里叫 dim。默认浮点类型是 float32。"],
ex:"a = torch.tensor([[1., 2.], [3., 4.]])\na.shape → torch.Size([2, 2])\na @ a → tensor([[ 7., 10.], [15., 22.]])\na.sum(dim=0) → tensor([4., 6.])\na.numpy() → 普通的 NumPy 数组"});
D("pt-device",{a:"厨房（GPU）和客厅（CPU）是两个房间。菜（数据）和厨师（模型）必须在同一个房间才能做饭。所以开始前要把它们都搬进厨房。",
s:["先选设备：`device = 'cuda' if torch.cuda.is_available() else 'cpu'`。Mac 可以用 'mps'。","模型搬过去：`model = model.to(device)`。","每个 batch 的数据也要搬：`x, y = x.to(device), y.to(device)`。","如果一个在 CPU、一个在 GPU，会报错：Expected all tensors to be on the same device。","要转回 NumPy 时，先 `.cpu()` 再 `.numpy()`。"],
ex:"device = 'cuda' if torch.cuda.is_available() else 'cpu'\nmodel = Net().to(device)\nfor x, y in loader:\n    x, y = x.to(device), y.to(device)\n    out = model(x)\n画图前：pred = out.detach().cpu().numpy()"});
D("pt-shape",{a:"张量形状就像一摞纸的排法：几本书、每本几页、每页几行几列。改形状只是换一种方式捆扎，纸的总张数不能变。",
s:["`x.view(2, 6)` 或 `x.reshape(2, 6)`：改形状，元素总数必须相同。用 −1 让 PyTorch 自动算：`x.view(x.size(0), -1)` 常用来展平。","`x.unsqueeze(0)`：在第 0 维插入一个长度 1 的维度，单张图变成 batch。","`x.squeeze()`：去掉所有长度为 1 的维度。","`x.permute(0, 2, 3, 1)`：调换维度顺序，比如 (B, C, H, W) → (B, H, W, C)，画图常用。","`torch.cat([a, b], dim=0)`：沿已有维度拼接。"],
ex:"img = torch.randn(3, 28, 28)        # 一张图\nimg.unsqueeze(0).shape → (1, 3, 28, 28)\nx = torch.randn(64, 3, 28, 28)\nx.view(64, -1).shape → (64, 2352)\nx.permute(0, 2, 3, 1).shape → (64, 28, 28, 3)"});
D("pt-autograd",{a:"你做饭时有个助手在旁边记下每一步：先切、再炒、再加盐。菜做咸了，助手能倒着推出“每一步对咸度贡献了多少”。autograd 就是这个助手，它记下计算图，`backward()` 时倒着算出所有梯度。",
s:["给需要求导的张量设 `requires_grad=True`（模型参数默认就是）。","正常写前向计算，PyTorch 自动建计算图。","对一个标量调用 `loss.backward()`，所有相关参数的梯度存在 `.grad` 里。","梯度会累加，所以每次反向前要清零：`optimizer.zero_grad()`。","不需要求导的时候（如测试）用 `with torch.no_grad():`，省内存省时间。"],
ex:"x = torch.tensor(3.0, requires_grad=True)\ny = x**2 + 2*x\ny.backward()\nx.grad → tensor(8.)   # dy/dx = 2x + 2 = 8\n这正是你在第 5 章用计算图手推的东西。"});
D("pt-module",{a:"nn.Module 像一张积木说明书：`__init__` 里列出需要哪些积木（层），`forward` 里写怎么把积木拼起来让数据流过去。",
s:["写一个类继承 `nn.Module`。","`__init__` 里先调用 `super().__init__()`，再定义层，比如 `self.fc1 = nn.Linear(784, 100)`。","`forward(self, x)` 里写数据怎么一层层流过。","用的时候直接 `model(x)`，不要写 `model.forward(x)`。","`model.parameters()` 自动收集所有层的参数，交给优化器。"],
ex:"class Net(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.fc1 = nn.Linear(784, 100)\n        self.fc2 = nn.Linear(100, 10)\n    def forward(self, x):\n        x = torch.relu(self.fc1(x))\n        return self.fc2(x)\n参数量：784×100 + 100 + 100×10 + 10 = 79510"});
D("pt-seq",{a:"如果积木只是一层接一层排成一列，不用写说明书，直接按顺序摆好就行。Sequential 就是这种“排队式”的网络。",
s:["`nn.Sequential(层1, 层2, ...)`：数据按顺序依次流过每一层。","全连接：`nn.Linear(in, out)`。","卷积：`nn.Conv2d(in_ch, out_ch, kernel_size, stride, padding)`。","池化：`nn.MaxPool2d(2)`。激活：`nn.ReLU()`。展平：`nn.Flatten()`。","其他常用：`nn.BatchNorm2d(ch)`、`nn.Dropout(0.5)`。有分支（如残差）时就要写类了。"],
ex:"model = nn.Sequential(\n    nn.Conv2d(1, 30, 5),   # (1,28,28) → (30,24,24)\n    nn.ReLU(),\n    nn.MaxPool2d(2),       # → (30,12,12)\n    nn.Flatten(),          # → 4320\n    nn.Linear(4320, 100),\n    nn.ReLU(),\n    nn.Linear(100, 10))\n这就是鱼书第 7 章那个 CNN。"});
D("pt-data",{a:"像食堂打饭：Dataset 是整个仓库，知道第几份饭是什么；DataLoader 是打饭窗口，每次端出一盘（一个 batch），每天上菜顺序还会打乱。",
s:["Dataset 要实现两个方法：`__len__` 返回样本数，`__getitem__(i)` 返回第 i 个样本 (x, y)。","数据已经是张量时，直接用 `TensorDataset(X, y)`。","`DataLoader(ds, batch_size=64, shuffle=True)`：自动切 batch、打乱。","测试集不需要打乱：`shuffle=False`。","torchvision 里有现成的 MNIST 等数据集，可以直接下载。"],
ex:"X = torch.randn(1000, 784); y = torch.randint(0, 10, (1000,))\nds = TensorDataset(X, y)\nloader = DataLoader(ds, batch_size=64, shuffle=True)\nlen(loader) → 16   # 1000/64 向上取整\nfor xb, yb in loader:  # xb.shape = (64, 784)，最后一批是 (40, 784)"});
D("pt-loop",{a:"每一轮训练都像练一次投篮：投出去（前向）→ 看偏了多少（算损失）→ 忘掉上一次的纠正（清零）→ 想清楚每个动作怎么改（反向）→ 调整动作（更新）。",
s:["① 前向：`out = model(x)`。","② 算损失：`loss = loss_fn(out, y)`，分类用 `nn.CrossEntropyLoss()`（内部已含 softmax）。","③ 清空梯度：`optimizer.zero_grad()`。","④ 反向传播：`loss.backward()`。","⑤ 更新参数：`optimizer.step()`。","外面套两层循环：外层 epoch，内层遍历 DataLoader。"],
ex:"for epoch in range(10):\n    model.train()\n    for x, y in loader:\n        out = model(x)\n        loss = loss_fn(out, y)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n    print(epoch, loss.item())\n忘了 zero_grad 的话，梯度会一直累加，训练会乱掉。"});
D("pt-optim",{a:"优化器是“怎么迈步”的策略（第 6 章那些 SGD、Adam），调度器是“随着时间换步幅”的计划表。",
s:["创建优化器，要把参数交给它：`optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)`。","SGD + 动量：`torch.optim.SGD(params, lr=0.01, momentum=0.9)`。","L2 正则化：加参数 `weight_decay=1e-4`。","学习率调度：`scheduler = torch.optim.lr_scheduler.StepLR(optimizer, step_size=10, gamma=0.1)`，每 10 轮把学习率乘 0.1。","每个 epoch 结束调用一次 `scheduler.step()`。"],
ex:"lr = 0.1，StepLR(step_size=10, gamma=0.1)\nepoch 0–9：lr = 0.1\nepoch 10–19：lr = 0.01\nepoch 20–29：lr = 0.001\n查看当前学习率：optimizer.param_groups[0]['lr']"});
D("pt-eval",{a:"考试时不能再看答案改作业。`model.eval()` 是告诉网络“现在是考试”：Dropout 不再随机关神经元，Batch Norm 用平时记下的均值方差。`no_grad()` 是“不用记笔记”，省力省纸。",
s:["测试前 `model.eval()`，训练前切回 `model.train()`。忘了切换，Dropout、BN 的行为就会错。","测试时包在 `with torch.no_grad():` 里，不建计算图，更快更省显存。","预测类别：`pred = out.argmax(dim=1)`；准确率：`(pred == y).float().mean()`。","保存：`torch.save(model.state_dict(), 'model.pt')`（只存参数）。","加载：先建同样结构的模型，再 `model.load_state_dict(torch.load('model.pt'))`。"],
ex:"model.eval()\ncorrect = 0\nwith torch.no_grad():\n    for x, y in test_loader:\n        pred = model(x).argmax(dim=1)\n        correct += (pred == y).sum().item()\nprint(correct / len(test_ds))   # 比如 0.987"});
D("dl-seq",{a:"“我爱你”和“你爱我”用的字一模一样，意思却不同。顺序本身就是信息。普通网络把输入当成一袋子数字，不管顺序，所以处理不好这类数据。",
s:["序列数据：每个样本是一串有先后的元素 x⟨1⟩, x⟨2⟩, …, x⟨T⟩。","例子：文本（一串词）、语音（一串声音帧）、股价（一串数字）、视频（一串画面）、DNA。","不同样本长度 T 可以不一样。","任务类型：多对一（情感分析）、一对多（生成音乐）、多对多等长（给每个词标词性）、多对多不等长（翻译）。","需要一种能“边读边记”的网络，这就是 RNN。"],
ex:"情感分析：“这部电影一点也不好看” → 负面（多对一）\n命名实体识别：“小明 去 北京” → [人名, 其他, 地名]（等长多对多）\n翻译：“我 爱 你” → “I love you”（不等长）"});
D("dl-rnn",{a:"你读小说时，读到每一句都会结合脑子里“之前的剧情”来理解，然后更新脑子里的剧情。RNN 的隐状态 a 就是“脑子里的剧情”，每读一个词就更新一次。",
s:["初始隐状态 a⟨0⟩ = 0。","第 t 步：a⟨t⟩ = tanh(Wₐₐ a⟨t−1⟩ + Wₐₓ x⟨t⟩ + b)，把旧记忆和新输入混合。","输出：ŷ⟨t⟩ = softmax(W_y a⟨t⟩ + b_y)。","每一步用的是同一套权重（参数共享），所以能处理任意长度的序列。","反向传播要沿时间一步步往回传，叫“沿时间反向传播”（BPTT）。"],
ex:"一维的玩具例子：Wₐₐ = 0.5，Wₐₓ = 1，b = 0，输入 x = [1, 0, 0]\na⟨1⟩ = tanh(0 + 1) ≈ 0.76\na⟨2⟩ = tanh(0.5×0.76 + 0) ≈ 0.36\na⟨3⟩ = tanh(0.5×0.36) ≈ 0.18\n第一个输入的“记忆”在一步步衰减。"});
D("dl-lm",{a:"手机输入法的联想：你打“今天天气”，它猜下一个字是“很”“真”“不错”。语言模型就是一个超级联想器，给出所有可能的下一个词的概率。",
s:["语言模型估计一句话的概率：P(句子) = P(w₁) × P(w₂ | w₁) × P(w₃ | w₁, w₂) × …","用 RNN 实现：每一步输入当前词，输出“下一个词”在整个词表上的 softmax 概率。","训练：拿大量文本，让网络在每个位置预测下一个真实的词，用交叉熵损失。","生成（采样）：给一个开头，按输出概率随机抽一个词，把它当成下一步的输入，重复，直到生成结束符 <EOS>。"],
ex:"“猫 坐 在 垫子 上”\n模型预测：P(猫) = 0.01，P(坐 | 猫) = 0.1，P(在 | 猫 坐) = 0.6，P(垫子 | …) = 0.2，P(上 | …) = 0.7\n整句概率 = 0.01 × 0.1 × 0.6 × 0.2 × 0.7 = 0.000084\n生成时，在“猫 坐 在”后面按概率抽：垫子 20%、沙发 15%、地 10%……"});
D("dl-rnnvanish",{a:"传话游戏又来了：句子开头说“那只猫，在吃了很多东西、跑了很远之后，……”，等到句尾要决定用“was”还是“were”时，开头“单数还是复数”的信息已经传得模糊不清了。",
s:["RNN 反向传播时，梯度要沿时间一步步往前乘。","序列长 100 步，就要乘 100 次 Wₐₐ 和 tanh 的导数。","导数通常小于 1 → 梯度消失，网络学不到长距离的依赖关系。","梯度爆炸也可能发生，但容易发现（出现 NaN），用梯度裁剪就能处理。","梯度消失更隐蔽，需要改结构：GRU、LSTM。"],
ex:"每步乘 0.9：\n10 步后 0.9¹⁰ ≈ 0.35\n50 步后 0.9⁵⁰ ≈ 0.005\n100 步后 0.9¹⁰⁰ ≈ 0.00003\n第 1 个词对第 100 步的损失几乎没有梯度贡献。"});
D("dl-gru",{a:"记忆像一个笔记本。普通 RNN 每读一个词就把整页重写；LSTM 有三个开关：“橡皮擦”决定擦掉多少旧笔记（遗忘门），“笔”决定写进多少新内容（输入门），“窗口”决定给别人看多少（输出门）。重要的事可以一直不擦，记很久。",
s:["LSTM 有一条单独的“记忆线” c⟨t⟩，信息在上面主要靠加法传递，不容易消失。","遗忘门 f = σ(…)：0～1 之间，决定保留多少旧记忆。","输入门 i = σ(…)：决定写入多少新候选记忆 c̃ = tanh(…)。","更新：c⟨t⟩ = f × c⟨t−1⟩ + i × c̃。","输出门 o = σ(…)：a⟨t⟩ = o × tanh(c⟨t⟩)。","GRU 是简化版：只有更新门和重置门，参数更少，效果常常差不多。"],
ex:"旧记忆 c = 5（比如“主语是单数”）\n遗忘门 f = 1，输入门 i = 0：c 新 = 1×5 + 0 = 5，完整保留\n读到新主语时：f = 0，i = 1，c̃ = −3：c 新 = 0 + (−3) = −3，记忆被替换\n门是 sigmoid 输出，网络自己学什么时候开、什么时候关。"});
D("dl-birnn",{a:"“他说，泰迪是美国总统”和“他说，泰迪熊打折了”：只看“泰迪”前面的字，判断不出是人名还是玩具，要看后面才知道。双向 RNN 让每个位置同时看到前文和后文。",
s:["前向 RNN：从左往右读，得到 a→⟨t⟩，包含前文信息。","后向 RNN：从右往左读，得到 a←⟨t⟩，包含后文信息。","每个位置的输出用两者拼起来：ŷ⟨t⟩ = g(W [a→⟨t⟩, a←⟨t⟩] + b)。","缺点：必须拿到整句才能计算，不适合实时语音这种“边听边出结果”的场景。","深层 RNN：把几层 RNN 叠起来，上一层每个时刻的输出作为下一层的输入，一般叠 2～3 层。"],
ex:"句子“我 去 北京”，每个方向隐状态 64 维：\n位置“去”的前向状态知道“我 去”，后向状态知道“北京 去”\n拼起来是 128 维，再接分类层。"});
D("dl-emb",{a:"给每个词发一张“性格卡片”，上面有几百个打分项：是不是动物、是不是食物、有多正式……意思相近的词，卡片上的分数也相近。这张卡片就是词向量。",
s:["one-hot：词表 1 万个词，每个词是 1 万维、只有一个 1 的向量。任意两个词的距离都一样，看不出“苹果”和“橙子”更像。","词嵌入：每个词用一个 300 维左右的稠密向量表示。","所有词的向量排成一个矩阵 E（词表大小 × 300），查表就能得到词向量。","这个矩阵是学出来的，学完后语义相近的词向量很接近。","还能做类比：向量(国王) − 向量(男人) + 向量(女人) ≈ 向量(女王)。"],
ex:"假设只有 2 个维度 [性别, 皇室]：\n男人 = [1, 0]，女人 = [−1, 0]，国王 = [1, 1]，女王 = [−1, 1]\n国王 − 男人 + 女人 = [1, 1] − [1, 0] + [−1, 0] = [−1, 1] = 女王\n相似度用余弦：cos(国王, 女王) = 0 / 2 = 0，cos(国王, 男人) = 1/√2 ≈ 0.71"});
D("dl-w2v",{a:"“看一个人的朋友圈，就知道他是什么人”。总和“喝”“杯”“热”一起出现的词，大概是饮料。word2vec 让网络从“一个词的邻居是谁”来学这个词的意思。",
s:["Skip-gram：从文本里取一个中心词（context），在它前后几个词内随机选一个目标词（target）。","训练一个简单网络：输入中心词的嵌入，用 softmax 预测目标词。","问题：词表有 1 万个词时，每一步 softmax 都要算 1 万次，太慢。","负采样：把它变成二分类。给一对真实的（中心词, 目标词）标 1，再随机抽 k 个词组成假对标 0（k 一般 5～20）。","每一步只更新 k + 1 个二分类器，快得多。训练完，嵌入矩阵就是我们要的词向量。"],
ex:"句子：“我 想 喝 一杯 橙汁”\n中心词“橙汁”，正样本：(橙汁, 一杯) → 1\n负样本（随机抽 4 个）：(橙汁, 国王) → 0，(橙汁, 书) → 0，(橙汁, 的) → 0，(橙汁, 跑) → 0\n负样本按词频的 3/4 次方抽，避免“的”“了”这种高频词抽得太多。"});
D("dl-token",{a:"文本要进网络，先要“切菜、编号、配料”：切成 token（切菜），每个 token 查词表换成编号（编号），再用编号查嵌入表换成向量（配料）。",
s:["分词：把句子切成 token。英文可以按空格切成词，但生僻词太多。","子词分词（如 BPE）：常见词保持完整，罕见词拆成几个常见片段，比如 “unhappiness” → “un” + “happi” + “ness”。","词表：所有 token 对应一个编号，比如 3 万个。","特殊 token：<PAD>（补齐长度）、<UNK>（未知词）、<BOS>/<EOS>（开始、结束）。","查表：编号 → 嵌入向量，这一步就是 `nn.Embedding(词表大小, 维度)`。"],
ex:"词表：{<PAD>:0, <UNK>:1, 我:2, 爱:3, 你:4, 猫:5}\n“我 爱 猫” → [2, 3, 5]\n“我 爱 狗” → [2, 3, 1]（狗不在词表里）\n补齐到长度 4：[2, 3, 5, 0]\nEmbedding(6, 8) 之后形状变成 (4, 8)。"});
D("dl-seq2seq",{a:"同声传译员先听完一整句中文，在脑子里形成一个“意思”，再把这个意思用英文一个词一个词说出来。编码器负责“听懂”，解码器负责“说出来”。",
s:["编码器：RNN 读入整个源句，最后的隐状态当作整句意思的摘要。","解码器：另一个 RNN，以这个摘要为初始状态，每步生成一个目标词，并把生成的词作为下一步的输入，直到 <EOS>。","贪心搜索：每步只选概率最高的词，但局部最优不一定整句最好。","束搜索（beam search）：每步保留概率最高的 B 个候选句子（B 常取 3～10），最后选整句概率最高的。","长度归一化：整句概率是连乘，越长越小，要除以长度（的某次方），否则偏爱短句。"],
ex:"B = 2：\n第 1 步：候选 “I” 0.5，“Me” 0.3，“My” 0.1 → 保留 I、Me\n第 2 步：I love 0.5×0.6 = 0.30，I like 0.5×0.3 = 0.15，Me love 0.3×0.2 = 0.06 → 保留 I love、I like\n一直这样走到 <EOS>，每步只保留 2 条。"});
D("dl-attn",{a:"翻译一个很长的句子时，人不会先把整句背下来再翻，而是翻到哪里就回头看原文对应的那几个词。注意力让解码器每生成一个词时，都可以“回头看”原文，并给每个原文词打一个“现在有多重要”的分数。",
s:["普通 seq2seq 把整句压成一个固定向量，句子一长就记不住（长句翻译质量明显下降）。","注意力：解码器第 t 步，拿自己当前的状态，和编码器每个位置的隐状态算一个相关分数 e。","用 softmax 把分数变成权重 α（加起来等于 1）。","上下文向量 = Σ α × 编码器各位置的隐状态，即按重要程度加权平均。","解码器用这个上下文向量 + 自己的状态来生成当前的词。α 还能画成热力图，看“翻译哪个词时在看哪里”。"],
ex:"原文“我 爱 猫”，编码器状态 h₁、h₂、h₃\n生成“cats”时，分数 e = [0.5, 1.0, 3.0]\nsoftmax → α ≈ [0.07, 0.11, 0.82]\n上下文 = 0.07 h₁ + 0.11 h₂ + 0.82 h₃，主要在看“猫”。"});
D("dl-selfattn",{a:"开会讨论时，每个人（词）都带着三样东西：一个问题（Query：我想找什么信息）、一张名片（Key：我能提供什么）、一份资料（Value：我实际的内容）。每个人用自己的问题去比对所有人的名片，越匹配就越多地参考那个人的资料。",
s:["每个词的向量 x 分别乘三个矩阵，得到 q = x W_Q，k = x W_K，v = x W_V。","词 i 对词 j 的相关分数 = qᵢ · kⱼ。","除以 √d（d 是 k 的维度），防止数太大让 softmax 过于尖锐。","对每一行做 softmax，得到权重。","输出 i = Σⱼ 权重ᵢⱼ × vⱼ。","矩阵写法：Attention(Q, K, V) = softmax(QKᵀ / √d) V。所有词同时算，可以并行。"],
ex:"两个词，d = 2：\nq₁ = [1, 0]，k₁ = [1, 0]，k₂ = [0, 1]，v₁ = [10, 0]，v₂ = [0, 10]\n分数：q₁·k₁ = 1，q₁·k₂ = 0，除以 √2 → 0.71、0\nsoftmax → [0.67, 0.33]\n输出₁ = 0.67×[10, 0] + 0.33×[0, 10] = [6.7, 3.3]"});
D("dl-mha",{a:"读一句话可以同时从几个角度看：谁做了什么（语法）、“它”指的是谁（指代）、语气是什么（情感）。多头注意力就是请几位专家，每人从一个角度做一遍注意力，最后把各自的结论拼起来。",
s:["把模型维度 d_model 分成 h 份，每份 d_k = d_model / h。","每个头有自己的 W_Q、W_K、W_V，各做一次自注意力。","h 个头的输出拼起来，再乘一个矩阵 W_O，回到 d_model 维。","总计算量和一个大头差不多，但能同时关注多种关系。","原始 Transformer：d_model = 512，h = 8，每个头 64 维。"],
ex:"d_model = 512，h = 8 → 每头 64 维\n输入 (10 个词, 512)\n每个头输出 (10, 64)\n8 个头拼起来 (10, 512)\n乘 W_O (512×512) → 输出 (10, 512)"});
D("dl-pe",{a:"把一句话的词写在卡片上扔进袋子，自注意力只看到“袋子里有哪些卡片”，不知道它们的顺序。位置编码就是在每张卡片上印一个页码。",
s:["自注意力对每对词都算相关度，如果打乱词序，每个词的输出也只是跟着换位置，内容一样。","所以要把位置信息加进去：输入 = 词向量 + 位置向量。","原始 Transformer 用正弦/余弦：PE(pos, 2i) = sin(pos / 10000^(2i/d))，PE(pos, 2i+1) = cos(…)。","不同维度的波长不同，像时钟的时针、分针、秒针，组合起来每个位置都独一无二。","也可以把位置向量当作参数直接学（BERT、GPT 就是这样）。"],
ex:"d = 4，位置 pos = 1：\ni = 0：sin(1) ≈ 0.84，cos(1) ≈ 0.54\ni = 1：sin(1/100) ≈ 0.01，cos(1/100) ≈ 1.00\nPE(1) ≈ [0.84, 0.54, 0.01, 1.00]\n位置 0：[0, 1, 0, 1]\n把它加到“我”的词向量上，网络就知道“我”在第几个。"});
D("dl-ffn",{a:"注意力像“开会交流”，每个词从别的词那里收集信息；FFN 像“回到工位自己消化”，每个词单独把收集来的信息加工一遍。残差和归一化是保证开很多轮会也不乱的规矩。",
s:["FFN：每个位置单独过两层全连接，FFN(x) = ReLU(x W₁ + b₁) W₂ + b₂。中间层通常是 4 倍宽（512 → 2048 → 512）。","所有位置用同一套 W₁、W₂。","残差：输出 = x + 子层(x)，和 ResNet 一样，让梯度能直通，深层也能训练。","层归一化（LayerNorm）：对每个词自己的那一个向量做均值 0、方差 1 的归一化（不像 Batch Norm 跨样本算），适合长度不一的序列。","一个块：x → x + 注意力(LN(x)) → x + FFN(LN(x))（现代常用的 Pre-LN 写法）。"],
ex:"某个词的向量 [1, 2, 3, 6]\nLayerNorm：均值 3，方差 (4+1+0+9)/4 = 3.5，标准差 ≈ 1.87\n→ [−1.07, −0.53, 0, 1.60]\nFFN 维度：512 → 2048 → 512，参数量 ≈ 512×2048×2 ≈ 210 万"});
D("dl-cross",{a:"翻译时，译员一边写自己的译文，一边回头看原文。自注意力是“看自己写过的”，交叉注意力是“看原文”：问题来自译文，名片和资料来自原文。",
s:["位置：解码器每个块里，在自注意力之后。","Q 来自解码器当前的状态（“我现在要翻哪部分”）。","K 和 V 来自编码器的输出（原文每个词的表示）。","公式不变：softmax(QKᵀ / √d) V，只是 Q 和 K、V 的来源不同。","这就是 Transformer 版的“注意力机制”，取代了 RNN seq2seq 里的那种注意力。"],
ex:"原文 5 个词 → 编码器输出 (5, 512) → K、V 都是 (5, 512)\n译文已生成 3 个词 → 解码器 Q 是 (3, 512)\nQKᵀ 是 (3, 5)：每个译文词对每个原文词的相关度\n乘 V 得到 (3, 512)。"});
D("dl-transformer",{a:"一座两栋楼的工厂：左楼（编码器）把原文反复加工 N 遍，得到对原文的深刻理解；右楼（解码器）一边生成译文，一边通过天桥（交叉注意力）去左楼查资料。每层楼的结构都一样，只是重复叠加。",
s:["输入：token → 嵌入 + 位置编码。","编码器块 × N：多头自注意力 → 残差+归一化 → FFN → 残差+归一化。","解码器块 × N：带掩码的多头自注意力 → 交叉注意力（看编码器）→ FFN，每步外面都有残差+归一化。","最后：线性层 + softmax，输出下一个词的概率。","原始论文 N = 6，d_model = 512，8 个头。全部用注意力，不用 RNN，所以可以并行训练，速度快很多。"],
ex:"翻译“我 爱 猫” → “I love cats”\n编码器：一次性处理 3 个词，输出 (3, 512)\n解码器训练时：输入 [<BOS>, I, love]，同时预测 [I, love, cats]（掩码保证不偷看）\n推理时：先输入 <BOS> 得到 I，再输入 [<BOS>, I] 得到 love……"});
D("dl-mask",{a:"考试时老师把试卷后面的题用纸盖住，只让你看已经做过的部分。训练 GPT 时，第 3 个词只能看第 1～3 个词，后面的必须盖住，否则它直接“抄答案”，什么也学不到。",
s:["注意力分数矩阵是 (T, T)：第 i 行是第 i 个词对所有词的分数。","因果掩码：把 j > i 的位置（右上三角）加上 −∞。","softmax 之后，e^(−∞) = 0，这些位置的权重变成 0。","这样一句话的 T 个位置可以同时训练，每个位置都只用到了它前面的信息。","GPT 就是“只有解码器、带因果掩码”的 Transformer 堆起来，任务就是预测下一个词。"],
ex:"3 个词的分数：\n[[2, 1, 3],\n [1, 2, 1],\n [0, 1, 2]]\n加掩码：\n[[2, −∞, −∞],\n [1, 2, −∞],\n [0, 1, 2]]\nsoftmax 每行：第 1 行 → [1, 0, 0]；第 2 行 → [0.27, 0.73, 0]"});
D("dl-bertgpt",{a:"BERT 像做完形填空：一句话挖掉几个词，前后文都能看，猜中间是什么，所以特别擅长“理解”。GPT 像接龙：只能看前面，猜下一个词，所以特别擅长“往下写”。",
s:["BERT：只用编码器（双向，看全句）。","预训练：随机遮住 15% 的词，让模型猜（掩码语言模型）。","用法：在 [CLS] 位置接一个分类层，微调做情感分析、问答等理解任务。","GPT：只用解码器（因果掩码，只看左边）。","预训练：在海量文本上预测下一个词。","用法：给一段提示，让它往下生成；模型够大时，不微调、只给几个例子（提示）也能完成新任务。"],
ex:"BERT 输入：“今天 [MASK] 很 好，我们 去 公园”\n要预测 [MASK] = “天气”，可以利用后面的“去 公园”\nGPT 输入：“今天 天气 很”\n只能根据前面三个词预测下一个：“好” 40%、“热” 20%……"});
D("dl-temp",{a:"温度像调节“胆量”的旋钮。温度低：只说最稳妥的话，每次答案几乎一样；温度高：敢说出平时不常说的词，更有创意，但也更可能胡说。",
s:["模型输出每个词的分数 z（logits）。","除以温度 T 后再做 softmax：p = softmax(z / T)。","T < 1：大的分数被放大得更多，分布更尖，几乎总选最可能的词。","T > 1：分数被压平，分布更均匀，冷门词也有机会被选中。","T → 0 就是贪心选最大。还有 top-k（只在前 k 个词里抽）和 top-p（只在累计概率达到 p 的那些词里抽），用来砍掉离谱的尾巴。"],
ex:"三个词的分数 z = [2, 1, 0]\nT = 1：softmax → [0.67, 0.24, 0.09]\nT = 0.5：z/T = [4, 2, 0] → [0.87, 0.12, 0.02]\nT = 2：z/T = [1, 0.5, 0] → [0.51, 0.31, 0.19]"});
D("dl-vit",{a:"把一张照片剪成一个个小方块，像拼图一样排成一行，每块当作一个“词”。这样，处理句子的 Transformer 不用任何改动就能处理图片。",
s:["把 224×224 的图切成 16×16 的小块，得到 14×14 = 196 块。","每块 16×16×3 = 768 个数，拉平后乘一个矩阵，变成一个 d 维向量（相当于词嵌入）。","前面加一个可学习的 [CLS] 向量，再给每块加位置编码。","送进 Transformer 编码器（只用编码器）。","最后用 [CLS] 位置的输出做分类。","ViT 没有卷积“看局部”的先天假设，数据少时不如 CNN，数据很大（几千万张图）时会超过 CNN。"],
ex:"输入 (3, 224, 224)\n切块：196 个 (3, 16, 16)\n每块拉平 768 维 → 线性映射到 768 维\n加 [CLS]：序列长度 197，形状 (197, 768)\n经过 12 层 Transformer → 取第 0 个位置 → 全连接到 1000 类"});
/* 详细讲解：数学基础 + ML 第 1 门。D(知识点id, {a:打个比方, s:[一步一步看], ex:算一个小例子}) */
D("m-vec",{a:"去超市买水果的清单：苹果 3 个、香蕉 2 根、橙子 5 个，写成 [3, 2, 5]。顺序固定，第 1 个永远是苹果，这就是一个向量。",
s:["向量里的每个数叫一个“分量”，有几个分量就叫几维向量。","2 维向量 [3, 2] 可以画在平面上：从原点出发，向右 3、向上 2 的一个箭头。","超过 3 维画不出来没关系，只要把它当成“一串按顺序排好的特征”就行。","机器学习里，一个样本就是一个向量：一套房子、一张图片、一个词，都被变成一串数字。"],
ex:"一张 2×2 的黑白小图片，像素值是\n[0, 255]\n[255, 0]\n一行一行排开就是 4 维向量 [0, 255, 255, 0]。MNIST 的 28×28 图片排开就是 784 维向量。"});
D("m-vecop",{a:"向量加法像把两张购物清单合并：你买 [3 苹果, 2 香蕉]，我买 [1 苹果, 4 香蕉]，合起来就是 [4, 6]。数乘像“每样都买双份”。",
s:["加法：两个向量维数必须一样，对应位置的数相加。","减法同理：对应位置相减，结果表示“从 b 指向 a 的箭头”。","数乘：一个普通的数乘以向量，每个分量都乘它，箭头方向不变、长度变化（乘负数会反向）。"],
ex:"a = [2, 1]，b = [1, 3]\na + b = [2+1, 1+3] = [3, 4]\na − b = [2−1, 1−3] = [1, −2]\n3a = [6, 3]"});
D("m-dot",{a:"点积像“按单价算总价”：买的数量 [3, 2, 5] 和单价 [4, 1, 2] 对应相乘再加起来，3×4 + 2×1 + 5×2 = 24 元。线性回归的 w·x 就是这样，“特征 × 权重”再求和。",
s:["两个向量维数相同，对应位置相乘。","把所有乘积加起来，得到一个数（不是向量）。","几何意义：点积大说明两个箭头方向接近；为 0 说明互相垂直；为负说明方向相反。","所以点积常用来衡量“两个东西有多像”：推荐系统里用户向量和电影向量点积越大，用户越可能喜欢。"],
ex:"a = [1, 2]，b = [3, 4]\na · b = 1×3 + 2×4 = 3 + 8 = 11\n再试 a = [1, 0]，b = [0, 1]（一个向右、一个向上，互相垂直）：1×0 + 0×1 = 0。"});
D("m-norm",{a:"向量长度就是箭头有多长，用勾股定理算：直角三角形两条直角边 3 和 4，斜边就是 5。",
s:["每个分量平方。","全部加起来。","开根号，得到长度。","两个点的距离 = 先相减得到差向量，再求它的长度。"],
ex:"点 A = (1, 1)，点 B = (4, 5)\nB − A = (3, 4)\n距离 = √(3² + 4²) = √25 = 5"});
D("m-mat",{a:"矩阵就像 Excel 表格：每一行是一个学生，每一列是一门课的成绩。",
s:["m 行 n 列的矩阵叫 m×n 矩阵，先说行再说列。","第 i 行第 j 列的元素记作 Aᵢⱼ。","在机器学习里，常把每个样本放一行：100 个样本、每个 3 个特征，就是 100×3 的矩阵 X。","神经网络一层的权重 W 也是矩阵：输入 3 个、输出 2 个神经元，W 就是 3×2。"],
ex:"3 个学生的语文、数学成绩：\n[[90, 80],\n [70, 95],\n [85, 60]]\n这是 3×2 矩阵，第 2 行第 2 列 = 95（第二个学生的数学）。"});
D("m-matmul",{a:"矩阵乘法是“批量算点积”：左边每一行（一个学生的各科成绩）和右边每一列（一套各科权重）做点积，得到一个总分。",
s:["先检查形状：左边的列数必须等于右边的行数。","结果的形状是“左边的行数 × 右边的列数”。","结果的第 i 行第 j 列 = 左边第 i 行 和 右边第 j 列 的点积。","一个一个格子算下去，就得到整个结果矩阵。"],
ex:"成绩 X = [[90, 80], [70, 95]]（2 个学生 × 2 门课）\n权重 w = [[0.6], [0.4]]（语文占 60%，数学占 40%）\nX · w：\n第 1 个学生：90×0.6 + 80×0.4 = 54 + 32 = 86\n第 2 个学生：70×0.6 + 95×0.4 = 42 + 38 = 80\n结果 [[86], [80]]，形状 (2×2)·(2×1) = (2×1)。"});
D("m-lin",{a:"矩阵像一台“变形机器”：把一张画好的图放进去，出来的图可能被拉宽、压扁、旋转，但直线还是直线，原点还在原点。",
s:["把矩阵乘到一个向量上，得到一个新向量，这就是一次变换。","对角矩阵 [[2,0],[0,1]] 把横向拉长 2 倍，纵向不变。","矩阵 [[0,−1],[1,0]] 把向量逆时针转 90°。","神经网络每一层：矩阵变换（拉伸旋转）+ 激活函数（弯曲），重复多次后，本来缠在一起的两类数据就能被一条线分开。"],
ex:"A = [[2, 0], [0, 1]]，v = [1, 1]\nA·v = [2×1 + 0×1, 0×1 + 1×1] = [2, 1]\n向量从 (1,1) 变成 (2,1)：横向被拉长了。"});
D("m-T",{a:"转置就像把表格“沿对角线翻过来”：原来一行一个学生，翻过来变成一列一个学生。",
s:["原来第 i 行第 j 列的元素，转置后跑到第 j 行第 i 列。","m×n 矩阵转置后变成 n×m。","向量转置：一列变成一行。","单位矩阵 I：对角线全是 1、其他全是 0，任何矩阵乘它都不变，就像数字里的 1。"],
ex:"A = [[1, 2, 3],\n     [4, 5, 6]]   (2×3)\nAᵀ = [[1, 4],\n      [2, 5],\n      [3, 6]]   (3×2)"});
D("m-sum",{a:"Σ 就是一个“累加器”，相当于代码里的 for 循环 + 累加变量。",
s:["Σ 下面写起点（i = 1），上面写终点（m）。","右边写每一项长什么样，i 从起点一直取到终点。","把每一项算出来，全部加起来。","看到 (1/m) Σ 就是“求平均值”。"],
ex:"Σᵢ₌₁³ i² = 1² + 2² + 3² = 1 + 4 + 9 = 14\n三个误差 2, −1, 3 的均方误差：(1/3) Σ eᵢ² = (4 + 1 + 9) / 3 ≈ 4.67"});
D("m-explog",{a:"eˣ 像利滚利的存款，越滚越快；log 反过来问“要滚多少次才能变成这么多”。",
s:["e ≈ 2.718 是一个特殊常数，eˣ 的导数还是 eˣ，算起来特别方便。","eˣ 永远大于 0：所以 softmax 用它把任意分数变成正数。","log 是 e 的反操作：log(eˣ) = x。log(1) = 0，越接近 0 log 越趋向负无穷。","log 把乘法变加法：log(a×b) = log a + log b，很多很小的概率相乘会变成 0，取 log 后变成相加就不会出问题。"],
ex:"e⁰ = 1，e¹ ≈ 2.72，e² ≈ 7.39，e⁻¹ ≈ 0.37\nlog(1) = 0，log(0.5) ≈ −0.69，log(0.1) ≈ −2.30，log(0.01) ≈ −4.61\n所以交叉熵 −log(p)：模型对正确答案只给 1% 的概率时，损失 4.61；给 50% 时，损失只有 0.69。"});
D("m-deriv",{a:"导数就是“坡度”：在山坡上某一点，往前走一小步，高度变化多少。开车时速度表显示的就是“路程对时间的导数”。",
s:["取函数上一点 x，再往右挪一点点 h。","看 y 变化了多少：f(x+h) − f(x)。","变化量除以 h，就是这一小段的平均坡度。","h 越来越小时，这个坡度的极限值就是导数 f′(x)。","记住几个常用公式就够用了：(x²)′ = 2x，(eˣ)′ = eˣ，(log x)′ = 1/x。"],
ex:"f(x) = x²，在 x = 3 处：\nf(3) = 9，f(3.001) = 9.006001\n坡度 ≈ (9.006001 − 9) / 0.001 = 6.001 ≈ 6\n用公式：f′(x) = 2x = 6。意思是 x 增加 1 个很小的单位，y 大约增加 6 倍那么多。"});
D("m-partial",{a:"站在山坡上，东西方向的坡度和南北方向的坡度不一样。只看东西方向的坡度，就是对 x 的偏导数；两个方向的坡度合在一起，就是梯度，它指向最陡的上坡方向。",
s:["函数有多个输入，比如 f(x, y)。","求 ∂f/∂x 时，把 y 当常数，只对 x 求导。","求 ∂f/∂y 时，把 x 当常数，只对 y 求导。","把所有偏导数排成向量，就是梯度 ∇f。梯度下降就是沿 −∇f 走。"],
ex:"f(x, y) = x² + 3xy\n∂f/∂x = 2x + 3y（y 当常数）\n∂f/∂y = 3x（x 当常数，x² 对 y 求导是 0）\n在点 (1, 2)：∇f = (2 + 6, 3) = (8, 3)"});
D("m-chain",{a:"汇率换算：1 美元 = 7 人民币，1 人民币 = 20 日元，那 1 美元 = 7 × 20 = 140 日元。每一层的“换算比例”相乘，就是链式法则。",
s:["先找出“里面”的函数 u = g(x) 和“外面”的函数 y = f(u)。","分别求 dy/du（外层导数）和 du/dx（内层导数）。","两个相乘：dy/dx = dy/du × du/dx。","层数再多也一样，一路乘下去。神经网络有几层就乘几次，这就是反向传播。"],
ex:"y = (2x + 1)³，求 x = 1 时的导数\n令 u = 2x + 1，y = u³\ndy/du = 3u²，du/dx = 2\ndy/dx = 3u² × 2 = 6(2x + 1)²\nx = 1 时 u = 3，dy/dx = 6 × 9 = 54"});
D("m-prob",{a:"天气预报说“明天下雨的概率 70%”：意思是类似的天气情况下，10 次里大约 7 次下雨。",
s:["概率在 0 到 1 之间：0 是不可能，1 是一定发生。","所有可能结果的概率加起来等于 1（下雨 0.7 + 不下雨 0.3 = 1）。","条件概率 P(A|B)：已知 B 发生了，A 发生的概率。比如“已知是阴天，下雨的概率”。","两件互不影响的事同时发生：概率相乘。"],
ex:"掷两次硬币都是正面：0.5 × 0.5 = 0.25\n分类模型输出 [猫 0.7, 狗 0.2, 鸟 0.1]，三个加起来正好 1，这就是一个概率分布。"});
D("m-meanvar",{a:"两个班平均分都是 80：一个班大家都在 78–82，另一个班有 100 分也有 60 分。均值一样，但“散不散”不一样，方差就是衡量这个的。",
s:["均值 μ：全部加起来除以个数。","每个数减去均值，得到“偏离多少”。","偏离量平方（消掉正负），再求平均，就是方差 σ²。","方差开根号得到标准差 σ，单位和原数据一样，更直观。"],
ex:"数据 2, 4, 6\nμ = (2 + 4 + 6) / 3 = 4\n偏离：−2, 0, 2，平方：4, 0, 4\nσ² = (4 + 0 + 4) / 3 ≈ 2.67，σ ≈ 1.63\n标准化：(x − μ) / σ → −1.22, 0, 1.22"});
/* ML 1-1 */
D("ml-what",{a:"教小孩认猫：你不会给他一条条规则（“有胡须、四条腿、尖耳朵……”），而是指着很多猫说“这是猫”，他自己就学会了。机器学习就是这样教电脑。",
s:["收集大量例子（数据）。","选一个模型：一个带可调参数的公式，比如 f(x) = wx + b。","定义“好坏标准”（代价函数），衡量模型答错了多少。","让电脑自动调参数，使代价越来越小，这个过程叫“训练”。","训练好后，拿新数据来让它预测。"],
ex:"想根据房子面积预测房价。给电脑 100 套房子的 (面积, 价格)，它自己找出“大约每平方米 2 万元”这样的规律，再用来估计一套 90 平米新房子大约 180 万。"});
D("ml-sup",{a:"监督学习像有老师批改的练习册：每道题都有标准答案，做完对答案、改错，慢慢就会做了。",
s:["数据是成对的：输入 x（题目）和正确输出 y（答案）。","模型看 x 给出预测 ŷ，跟 y 比较，算出错了多少。","根据错误调整参数，反复练习。","如果 y 是数字（房价、温度），叫**回归**；如果 y 是类别（猫/狗、是/否），叫**分类**。"],
ex:"回归：输入“面积 100 平米”，输出“300 万元”（连续的数）。\n分类：输入一封邮件的内容，输出“垃圾邮件”或“正常邮件”（两个类别里选一个）。\n肿瘤大小 → 良性/恶性，也是分类。"});
D("ml-unsup",{a:"给你一堆没贴标签的照片，让你自己分组。你可能按“风景、人物、食物”分，没人告诉你答案，你自己发现了结构。",
s:["数据只有 x，没有 y（没有标准答案）。","算法自己找数据里的规律：哪些样本相似、哪些与众不同。","聚类：把相似的放一组。","异常检测：找出和大部分数据不一样的。","降维：把很多特征压缩成少数几个，方便画图和计算。"],
ex:"电商有 100 万用户的购买记录，不知道该怎么分类。用聚类算法自动分成几群：“常买母婴用品的”“常买电子产品的”“只在打折时买的”，再针对每群做营销。"});
D("ml-linreg",{a:"在一张散点图上，拿一把尺子摆来摆去，找一条最贴近所有点的直线。w 是尺子的倾斜程度，b 是尺子上下的位置。",
s:["画出数据：横轴面积 x，纵轴价格 y，每套房子是一个点。","假设关系是一条直线：f(x) = wx + b。","w（斜率）：面积每多 1 平米，价格多多少。","b（截距）：面积为 0 时的“起步价”。","学习的目标就是找到让直线最贴近这些点的 w 和 b。"],
ex:"假设学到 w = 2（万元/平米），b = 10（万元）。\n预测 100 平米的房子：f(100) = 2 × 100 + 10 = 210 万元。\n预测 50 平米：f(50) = 2 × 50 + 10 = 110 万元。"});
D("ml-cost",{a:"射箭打靶：每支箭离靶心的距离就是误差。把所有箭的“距离平方”取平均，就是你这一轮的成绩，越小越准。",
s:["对每个样本，算预测值和真实值的差：f(x⁽ⁱ⁾) − y⁽ⁱ⁾。","把差平方：负的变正的，大的误差被放得更大。","把所有样本的平方误差加起来。","除以 2m 取平均（除 2 是为了求导后系数好看）。","不同的 w、b 会得到不同的 J，我们要找让 J 最小的那组。"],
ex:"3 个样本：(1, 2), (2, 4), (3, 6)，试 w = 1, b = 0：\n预测 1, 2, 3；误差 −1, −2, −3；平方 1, 4, 9\nJ = (1 + 4 + 9) / (2×3) = 14 / 6 ≈ 2.33\n再试 w = 2, b = 0：预测 2, 4, 6，误差全是 0，J = 0。所以 w = 2 更好。"});
D("ml-costvis",{a:"想象一个碗：碗里每个位置对应一组 (w, b)，高度是这组参数的代价 J。我们要找碗底。",
s:["固定 b = 0，只改 w，画出 J 随 w 的变化：是一条 U 形抛物线。","同时改 w 和 b，画出来是一个三维的碗。","从上往下俯视，把同样高度的点连起来，就得到一圈圈的椭圆（等高线），像地图上的山。","碗底中心就是最好的 (w, b)。线性回归的碗只有一个底，不会走错。"],
ex:"接上一节的数据，b = 0 时：\nw = 0 → J = (4 + 16 + 36)/6 ≈ 9.33\nw = 1 → J ≈ 2.33\nw = 2 → J = 0（最低点）\nw = 3 → J ≈ 2.33\n画出来正好是一个以 w = 2 为底的 U 形。"});
D("ml-gd",{a:"你蒙着眼睛站在山坡上想走到谷底。你能做的就是用脚感觉哪个方向往下最陡，然后往那边迈一小步，再感觉、再迈步，一直重复。",
s:["随便选一个起点（比如 w = 0, b = 0）。","算出代价函数在这一点的导数（坡度）。","导数为正说明往右是上坡，就往左走；为负就往右走。公式里的减号正好做到这一点。","步子大小 = 学习率 α × 坡度。","更新 w 和 b，回到第 2 步，重复几百几千次，直到几乎不动了。"],
ex:"J(w) = (w − 3)²，导数 J′(w) = 2(w − 3)，α = 0.1，从 w = 0 出发：\n第 1 步：导数 = −6，w = 0 − 0.1×(−6) = 0.6\n第 2 步：导数 = −4.8，w = 0.6 + 0.48 = 1.08\n第 3 步：导数 = −3.84，w = 1.08 + 0.384 = 1.464\n……一步步接近 3，越接近步子越小。"});
D("ml-lr",{a:"下山时的步幅：小碎步很安全但走到天黑；一步跨太大可能直接跳到对面山坡上，越跳越高。",
s:["α 太小：每步都对，但要走非常多步，训练很慢。","α 太大：一步跨过谷底，跑到另一边更高的地方，J 不降反升，甚至越来越大（发散）。","α 合适：J 稳定下降。","调学习率的方法：从 0.001 开始，每次乘 3 左右试一遍，画出 J 的曲线，选下降又快又稳的那个。"],
ex:"还是 J(w) = (w − 3)²，从 w = 0 出发：\nα = 0.01：第一步 w = 0.06，要几百步才到 3\nα = 0.1：第一步 w = 0.6，几十步就到\nα = 1.1：第一步 w = 6.6，第二步 w = −0.96，第三步 w = 7.75……越跳越远"});
D("ml-gdlin",{a:"老师批改作业时，错得越多、这道题分值越高，你就越应该花力气在这道题上。“误差 × 特征值”就是这个意思。",
s:["用当前的 w、b，对每个样本算预测值 f(x⁽ⁱ⁾)。","算每个样本的误差：f(x⁽ⁱ⁾) − y⁽ⁱ⁾。","w 的梯度 = 误差 × x 的平均；b 的梯度 = 误差的平均。","同时更新：w = w − α·dw，b = b − α·db。","重复以上步骤，“批量”的意思是每一步都用上全部样本。"],
ex:"数据 (1, 2), (2, 4)，初始 w = 0, b = 0，α = 0.1\n预测 0, 0；误差 −2, −4\ndw = (−2×1 + −4×2) / 2 = −5\ndb = (−2 + −4) / 2 = −3\nw = 0 − 0.1×(−5) = 0.5，b = 0 − 0.1×(−3) = 0.3\n一步之后，w 已经往正确答案 2 的方向移动了。"});
D("ml-notation",{a:"像班级花名册：m 是全班人数，x⁽³⁾ 是第 3 号同学的资料，x₂⁽³⁾ 是第 3 号同学的第 2 项资料（比如身高）。",
s:["小写 x、y：一个样本的输入和答案。","上标 (i)：第几个样本，不是平方。","下标 j：第几个特征。","m：样本总数；n：特征总数。","ŷ（y-hat）：模型的预测值，带“帽子”表示是猜出来的。"],
ex:"房价数据有 47 套房子，每套有面积、卧室数、楼层、房龄 4 个特征：m = 47，n = 4。\n第 2 套房子的卧室数写作 x₂⁽²⁾。"});
D("ml-gdintuit",{a:"小球放在碗的边上，不管放在左边还是右边，都会往碗底滚。梯度下降的公式自动决定了往哪边“滚”。",
s:["在最低点右边，曲线往右上升，导数为正。","w = w − α × 正数，w 变小，往左走，靠近最低点。","在最低点左边，导数为负，w = w − α × 负数，w 变大，往右走。","到了最低点，导数为 0，w 不再变化，停住。"],
ex:"J(w) = w²，最低点在 0，α = 0.25\nw = 4：导数 8，新 w = 4 − 2 = 2\nw = −4：导数 −8，新 w = −4 + 2 = −2\n两边都往 0 靠近。"});
/* ML 1-2 */
D("ml-multi",{a:"只看面积猜房价不够准，还要看几室、几楼、房龄。就像给一道菜打分，要综合味道、颜值、价格多个方面。",
s:["每个样本不再是一个数，而是一个向量 x = [x₁, x₂, …, xₙ]。","每个特征配一个权重 wⱼ，表示这个特征有多重要。","预测 = 各特征 × 各自权重，全部加起来，再加 b。","权重为正：这个特征越大，预测越高；为负：越大预测越低（比如房龄）。"],
ex:"w = [0.1, 4, 10, −2]，b = 80（单位：千美元）\n房子：面积 1200 平方英尺、3 室、1 层、房龄 40 年\nf = 0.1×1200 + 4×3 + 10×1 − 2×40 + 80 = 120 + 12 + 10 − 80 + 80 = 142（千美元）"});
D("ml-vec",{a:"超市收银：一件件扫码再心算是 for 循环；收银机一次把所有商品的价格算完是向量化。",
s:["不向量化：写 for 循环，一个一个乘、一个一个加。","向量化：把 w 和 x 都当成数组，用 np.dot 一次算完。","NumPy 底层用 C 语言，还能让 CPU/GPU 同时算很多个数。","特征数越多、样本越多，差距越大，可以快上百倍。"],
ex:"n = 4 个特征时，for 循环要执行 4 次乘法 + 4 次加法，一步一步来。\nnp.dot(w, x) 一条指令同时完成，对 100 万个特征时差距从几秒到几毫秒。"});
D("ml-gdmulti",{a:"一个团队（多个参数）一起下山：每个人看自己脚下的坡度，各自迈一步，但大家同时迈。",
s:["算所有样本的预测和误差（和一元时一样）。","对每个 wⱼ：梯度 = 误差 × 第 j 个特征的平均。","b 的梯度 = 误差的平均。","所有参数同时更新。"],
ex:"2 个特征，样本 x = [1, 2]，y = 5，初始 w = [0, 0]，b = 0，α = 0.1\n预测 0，误差 −5\ndw₁ = −5 × 1 = −5，dw₂ = −5 × 2 = −10，db = −5\nw = [0.5, 1.0]，b = 0.5\n新预测 = 0.5 + 2 + 0.5 = 3，已经更接近 5。"});
D("ml-scale",{a:"一个特征用“米”量、另一个用“毫米”量，数字大小差 1000 倍，模型就会“偏心”。把它们换成同样的尺度，大家公平竞争，下山的路也更直。",
s:["问题：面积是几百到几千，卧室数是 1 到 5，代价函数被拉成细长的椭圆。","梯度下降在细长山谷里会左右来回撞墙，走得很慢。","解决：把每个特征都缩放到差不多的范围。","最常用的 Z-score：减去这个特征的均值，再除以标准差，结果大约在 −3 到 3 之间。","缩放后的等高线接近圆形，梯度下降几乎直奔谷底。"],
ex:"面积数据 [1000, 1500, 2000]：μ = 1500，σ ≈ 408\n标准化后 ≈ [−1.22, 0, 1.22]\n卧室 [2, 3, 4]：μ = 3，σ ≈ 0.82，标准化后 ≈ [−1.22, 0, 1.22]\n两个特征现在在同一个量级了。"});
D("ml-conv",{a:"减肥时每天称体重画成曲线：一直往下走说明方法有效；某天突然上升要找原因；走平了说明到瓶颈了。",
s:["每次迭代后记录一次 J。","画出“迭代次数 – J”的曲线。","正常：一直下降，越来越平。","J 上升或上下跳：学习率太大，或代码有错。","可以设一个小阈值 ε（如 0.001），J 一次下降不到 ε 就认为收敛了，但看图更可靠。"],
ex:"J 记录：100, 60, 40, 30, 25, 23, 22.5, 22.3, 22.2……后面几乎不变，说明已经收敛，再训练也没多大用了。\n如果是 100, 150, 300, 900……就是发散，赶紧把学习率调小。"});
D("ml-fe",{a:"厨师做菜不光看原材料，还会切、腌、搭配。特征工程就是把原始数据“加工”成对预测更有用的形式。",
s:["思考：什么因素真正决定了要预测的东西？","用已有特征组合出新特征：相乘、相除、取对数等。","把新特征加进模型训练，看效果是否变好。","深度学习的一大优势就是能自动学出好特征，但传统机器学习很依赖人来做这一步。"],
ex:"地块宽 x₁ = 20 米，深 x₂ = 30 米。\n新特征面积 x₃ = x₁ × x₂ = 600 平米。\n房价和面积的关系通常比和宽、深各自的关系更直接。"});
D("ml-poly",{a:"用直尺描不出弯曲的山路，但如果允许用弯尺（加入 x²、x³），就能贴合弯曲的形状。",
s:["原始特征只有 x，数据呈弯曲的趋势。","造新特征：x² 、x³（或 √x）。","把它们当成普通特征，用多元线性回归来学：f = w₁x + w₂x² + w₃x³ + b。","一定要做特征缩放，因为 x³ 的数值会非常大。","次数太高会过拟合，后面会讲怎么选。"],
ex:"x 的范围 1 到 1000：\nx² 的范围 1 到 100 万\nx³ 的范围 1 到 10 亿\n不缩放的话，w₃ 稍微动一下预测就天翻地覆，梯度下降几乎没法工作。"});
D("ml-normal",{a:"梯度下降是一步步摸着下山；正规方程是拿着地图直接算出谷底的坐标。",
s:["把所有样本排成矩阵 X，答案排成向量 y。","直接套公式 w = (XᵀX)⁻¹Xᵀy。","一步得到答案，不用迭代、不用调学习率。","但需要求矩阵的逆，特征上万个时会非常慢，而且只对线性回归有效。"],
ex:"特征 100 个以内：正规方程很快。\n特征 10 万个：要求 10 万 × 10 万矩阵的逆，计算量巨大，这时用梯度下降。"});
D("ml-sklearn",{a:"自己用 NumPy 写算法像自己做家具，学会原理；scikit-learn 像买成品家具，拿来就能用。",
s:["`StandardScaler` 自动算均值和标准差，完成特征缩放。","`fit_transform` = 先学习缩放参数，再变换数据。","`SGDRegressor` 用梯度下降训练线性回归。","`.fit(X, y)` 训练，`.predict(X_new)` 预测。"],
ex:"训练完后 model.coef_ 可能是 [110.6, −21.2, −32.7, −37.9]，表示面积越大价格越高，卧室多、楼层高、房龄大的价格反而低一些（在其他条件相同时）。"});
/* ML 1-3 */
D("ml-cls",{a:"判断肿瘤良性还是恶性，用直线拟合 0 和 1：只要右边多出一个很大的肿瘤样本，直线就被拉得更平，原本判对的样本也会被判错。",
s:["分类的答案只有 0 或 1。","线性回归的输出可以是 −5 或 3.7，没法当概率解释。","离群点会把直线拉偏，0.5 的分界位置跟着移动，造成误判。","需要一个输出永远在 0 到 1 之间、对离群点不敏感的模型：逻辑回归。"],
ex:"肿瘤大小 1, 2, 3 cm 是良性（0），4, 5, 6 cm 是恶性（1），直线大约在 3.5 cm 处过 0.5，分得很好。\n再加一个 20 cm 的恶性样本，直线变平，0.5 的位置右移到 5 cm 左右，4 cm 的恶性肿瘤就被误判成良性了。"});
D("ml-logreg",{a:"sigmoid 像一个“调光开关”：输入很小时灯几乎全灭（接近 0），输入很大时灯几乎全亮（接近 1），中间平滑过渡。",
s:["先像线性回归一样算一个分数 z = w·x + b，可以是任意数。","把 z 送进 sigmoid：g(z) = 1 / (1 + e⁻ᶻ)。","z 越大，e⁻ᶻ 越接近 0，g 越接近 1；z 越小，g 越接近 0。","输出解释为“y = 1 的概率”。"],
ex:"z = 0：g = 1 / (1 + 1) = 0.5\nz = 2：g = 1 / (1 + e⁻²) = 1 / (1 + 0.135) ≈ 0.88\nz = −2：g ≈ 0.12\nz = 5：g ≈ 0.993\n肿瘤模型输出 0.88，就是说“恶性的概率约 88%”。"});
D("ml-db",{a:"决策边界像地图上的国界线：线这边是 A 国（预测 1），那边是 B 国（预测 0）。",
s:["预测规则：概率 ≥ 0.5 判为 1，否则判为 0。","sigmoid 输出 0.5 恰好是 z = 0 的时候。","所以分界线就是 w·x + b = 0。","线性特征得到直线边界；加入 x²、x₁x₂ 等特征，可以得到圆、椭圆等弯曲的边界。"],
ex:"w = [1, 1]，b = −3：边界是 x₁ + x₂ = 3 这条直线。\n点 (1, 1)：z = −1 < 0，预测 0\n点 (2, 2)：z = 1 > 0，预测 1\n用 f = g(x₁² + x₂² − 1)，边界是半径为 1 的圆：圆外预测 1，圆内预测 0。"});
D("ml-logloss",{a:"考试时你很有把握地写了错误答案（99% 确定选 A，结果是 B），应该扣更多分；犹豫着写错扣得少一点。交叉熵就是这样打分的。",
s:["真实答案是 1 时，损失 = −log(f)：f 越接近 1 损失越接近 0，f 接近 0 时损失飞向无穷大。","真实答案是 0 时，损失 = −log(1 − f)：f 越接近 0 越好。","两种情况合成一个公式：L = −y·log(f) − (1−y)·log(1−f)，y 是 0 或 1 时正好只剩一项。","所有样本的损失取平均，就是代价 J。","这个代价函数是凸的（碗形），梯度下降不会卡住。"],
ex:"y = 1：\nf = 0.9 → L = −log 0.9 ≈ 0.105（猜对了，罚得少）\nf = 0.5 → L = −log 0.5 ≈ 0.69\nf = 0.1 → L = −log 0.1 ≈ 2.30（很自信地猜错，罚得重）\nf = 0.01 → L ≈ 4.61"});
D("ml-loggd",{a:"同一套下山方法换了一座山：步骤一模一样，只是“预测值”的算法换成了 sigmoid。",
s:["对每个样本算 f = sigmoid(w·x + b)。","误差 = f − y。","dw = 误差 × x 的平均，db = 误差的平均（和线性回归同形式）。","同时更新 w、b，重复。","同样可以用特征缩放加速，用学习曲线判断收敛。"],
ex:"一个样本 x = 2，y = 1，w = 0，b = 0，α = 0.5\nf = sigmoid(0) = 0.5，误差 = −0.5\ndw = −0.5 × 2 = −1，db = −0.5\nw = 0.5，b = 0.25\n新的 f = sigmoid(0.5×2 + 0.25) = sigmoid(1.25) ≈ 0.78，更接近 1 了。"});
D("ml-overfit",{a:"三个学生准备考试：甲只背了一个公式，什么题都套它（欠拟合）；乙理解了原理（刚好）；丙把练习册答案全背下来，练习题满分，考试换了题就不会（过拟合）。",
s:["欠拟合（高偏差）：模型太简单，连训练数据都拟合不好。","刚好：抓住了主要规律，在新数据上也表现好。","过拟合（高方差）：模型太复杂，连数据里的噪声都记住了，曲线弯弯绕绕穿过每个点。","过拟合的信号：训练误差很低，但新数据上误差很高。","泛化能力：在没见过的数据上表现好，这才是真正的目标。"],
ex:"5 个房价数据点：\n直线 f = wx + b：大致趋势对，但有些点离得远（欠拟合）\n二次曲线：贴合得很好（刚好）\n四次多项式：正好穿过全部 5 个点，训练误差 0，但两点之间上下乱弯，预测新房子价格很离谱（过拟合）"});
D("ml-fixof",{a:"治“死记硬背”：①多做不同的题（更多数据）；②只记最重要的知识点（减少特征）；③要求答案简洁、不许绕弯（正则化）。",
s:["更多数据：数据多了，复杂模型也很难把每个点都“背下来”，被迫学到真正的规律。","减少特征：去掉不重要的特征，模型变简单。缺点是可能扔掉有用的信息。","正则化：保留所有特征，但让每个特征的权重都小一些，曲线变平滑。","实际中正则化最常用，经常和更多数据一起用。"],
ex:"用 100 个特征预测房价，只有 50 个样本，很容易过拟合。\n办法①：收集到 5000 个样本；\n办法②：只保留面积、卧室数、房龄等 10 个最相关的特征；\n办法③：加正则化，λ = 1。"});
D("ml-reg",{a:"给模型定一条“预算规则”：参数越大花钱越多。模型想降低误差就得花钱，于是只会把钱花在真正重要的特征上，其余参数都缩得很小。",
s:["原来的代价只看误差。","加一项 (λ/2m) × Σwⱼ²：所有权重的平方和，乘一个系数 λ。","现在要最小化“误差 + 参数大小”，模型会在两者之间取平衡。","λ 大：更看重参数小，曲线更平滑（太大会欠拟合）。λ 小：更看重误差（太小会过拟合）。","通常不惩罚 b，因为它只是上下平移，不会让曲线变弯。"],
ex:"两组参数误差都差不多是 1.0：\nA：w = [1, 2]，Σw² = 5\nB：w = [10, −8]，Σw² = 164\nλ = 1，m = 10 时，A 的代价 = 1.0 + 5/20 = 1.25，B 的代价 = 1.0 + 164/20 = 9.2\n正则化会选择更“温和”的 A。"});
D("ml-threshold",{a:"门禁系统：阈值高，陌生人很难混进来，但自己人偶尔也被拦；阈值低，自己人很少被拦，但陌生人可能混进来。",
s:["模型输出一个概率 f。","f ≥ 阈值 → 预测 1，否则预测 0。","默认阈值 0.5。","漏判代价大（癌症）就调低阈值，宁可多查；误报代价大（冤枉好人）就调高阈值。"],
ex:"模型对某病人输出 0.35：\n阈值 0.5 → 判为没病\n阈值 0.3 → 判为有病，建议进一步检查"});
D("ml-reglin",{a:"每次更新前先给参数“打个九九折”，再按梯度走一步。参数不会无节制地变大。",
s:["正则化项对 wⱼ 求导，多出 (λ/m)·wⱼ。","更新公式变成 wⱼ = wⱼ(1 − αλ/m) − α × 原来的梯度。","1 − αλ/m 是一个比 1 小一点点的数（比如 0.998）。","所以每一步 w 都会先被稍微缩小，再正常更新，这就是“权重衰减”。"],
ex:"α = 0.01，λ = 1，m = 50：1 − αλ/m = 1 − 0.0002 = 0.9998\nw = 5 时，先变成 5 × 0.9998 = 4.999，再减去 α × 梯度。"});
/* 详细讲解：ML 第 2 门 */
D("ml-nnintro",{a:"一家公司做决策：基层员工各看一个方面（价格、品牌、质量），中层把他们的意见汇总成几个判断，老板最后拍板。每个员工就是一个神经元，每个层级就是一层。",
s:["输入层：原始数据，比如价格、运费、营销费、材质。","隐藏层：几个神经元，每个都把输入加权组合后过激活函数，得出一个中间判断（比如“实惠程度”）。","输出层：把中间判断组合起来，给出最终答案（畅销的概率）。","关键：中间判断是什么，不需要人告诉它，网络在训练中自己学出来。"],
ex:"T 恤畅销预测：\n输入 4 个特征 → 隐藏层 3 个神经元（自己学成“实惠”“知名度”“质量感”）→ 输出 1 个神经元：畅销概率 0.84。"});
D("ml-layer",{a:"工厂流水线：原料从一头进去（输入层），经过几道加工工序（隐藏层），最后出成品（输出层）。",
s:["输入层就是数据本身，不做计算。","每个隐藏层接收上一层的输出，算出新的一组数，叫“激活值” a。","输出层给出最终预测。","符号 a^[1] 是第 1 层的输出，a^[2] 是第 2 层的输出，以此类推。","说“2 层网络”通常指 1 个隐藏层 + 1 个输出层。"],
ex:"手写数字识别网络：输入 64 个像素 → 第 1 层 25 个神经元 → 第 2 层 15 个 → 第 3 层 1 个（是数字 1 的概率）。这是 3 层网络。"});
D("ml-layercalc",{a:"每个神经元都是一个“小评委”：给每个输入打个权重分，加起来再加上自己的偏好 b，最后用激活函数决定“我有多认可”。",
s:["神经元拿到上一层的所有输出 a^[l−1]。","算 z = w·a + b（加权求和）。","算 a = g(z)（比如 sigmoid）。","同一层的每个神经元都这样算，只是 w、b 不同。","把这一层所有神经元的 a 排成向量，传给下一层。"],
ex:"输入 x = [1, 2]，一个神经元 w = [0.5, −1]，b = 1：\nz = 0.5×1 + (−1)×2 + 1 = −0.5\na = sigmoid(−0.5) ≈ 0.38"});
D("ml-fwd",{a:"接力赛：第一棒跑完把结果交给第二棒，第二棒再交给第三棒，最后一棒冲线就是预测结果。",
s:["把输入 x 当成 a^[0]。","用第 1 层的 W、b 算出 a^[1]。","用第 2 层的 W、b 和 a^[1] 算出 a^[2]。","一直算到输出层，得到 ŷ。","前向传播只做计算，不改参数；改参数是训练（反向传播）的事。"],
ex:"x = [1, 2]\n第 1 层 2 个神经元，算出 a^[1] = [0.38, 0.73]\n第 2 层 1 个神经元 w = [2, 1]，b = −1：z = 0.76 + 0.73 − 1 = 0.49，ŷ = sigmoid(0.49) ≈ 0.62\n预测“是 1 类”的概率 62%。"});
D("ml-tf",{a:"TensorFlow 和 PyTorch 像两个品牌的乐高：积木形状不同，搭出来的房子是一样的。",
s:["`Dense(25, activation='sigmoid')`：一个有 25 个神经元的全连接层。","`Sequential([...])`：把几层按顺序串起来。","`model.predict(x)`：做一次前向传播。","我们的计划用 PyTorch，看课程时只需理解每行在做什么。"],
ex:"TensorFlow 的 Dense(25) ≈ PyTorch 的 nn.Linear(输入数, 25) + 激活函数 ≈ 鱼书的 Affine 层 + Sigmoid 层。"});
D("ml-nnvec",{a:"一个人一张张盖章（for 循环）对比一台机器一次盖一整页（矩阵乘法）。",
s:["一层的所有 w 排成矩阵 W（每列一个神经元）。","一批样本排成矩阵 A_in（每行一个样本）。","Z = A_in @ W + b，一次算出所有样本、所有神经元的 z。","A_out = g(Z)。GPU 特别擅长这种大矩阵乘法。"],
ex:"100 个样本 × 64 个特征，乘以 64 × 25 的权重，得到 100 × 25：100 个样本在 25 个神经元上的输出，一条语句完成。"});
D("ml-dense",{a:"把“一层”的计算写成一个可以反复调用的函数，就像把一道工序做成一台机器，流水线上摆几台就是几层。",
s:["dense 函数输入：上一层输出、本层权重 W、偏置 b。","np.matmul 算加权和，加上 b。","过 sigmoid 得到本层输出。","sequential 函数把几个 dense 串起来，就是完整的前向传播。"],
ex:"x 形状 (1, 2)，W1 形状 (2, 3)，b1 形状 (3,) → a1 形状 (1, 3)\nW2 形状 (3, 1) → a2 形状 (1, 1)，就是最终概率。"});
D("ml-agi",{a:"人工神经元和真实神经元的关系，就像飞机和鸟：受鸟的启发，但飞机不扇翅膀。",
s:["真实大脑的工作原理人类还不太清楚。","人工神经网络只是借用了“很多简单单元连在一起”这个想法。","专用 AI（ANI）：只会做一件事，比如下棋、识图，已经很强。","通用 AI（AGI）：像人一样什么都能学，目前还没有实现。"],
ex:"语音助手能听懂你说话、帮你查天气，是几个专用 AI 拼起来的；它并不真正“理解”世界。"});
/* ML 2-2 */
D("ml-train3",{a:"教一个学生：①先确定他用什么方法答题（模型）；②确定怎么扣分（损失）；③让他做题、对答案、改正，反复练（优化）。",
s:["第一步：定义模型结构，几层、每层几个神经元、用什么激活函数。","第二步：选择损失函数，分类用交叉熵，回归用均方误差。","第三步：用梯度下降（或 Adam）反复更新参数。每一轮都用反向传播算梯度。","训练多少轮叫 epochs。"],
ex:"手写数字 0/1 识别：\n①模型：25 → 15 → 1 个神经元，sigmoid\n②损失：二元交叉熵\n③训练：100 个 epoch，每次更新所有 W 和 b"});
D("ml-act",{a:"激活函数是神经元的“性格”：sigmoid 是温和派，把一切压到 0–1；ReLU 是直爽派，负的直接说 0，正的原样说出来；线性是传话筒，原封不动。",
s:["sigmoid：输出 0 到 1，适合表示概率。","ReLU：g(z) = max(0, z)，小于 0 变 0，大于 0 不变。","线性：g(z) = z，等于没用激活函数。","输出层看答案的形式选；隐藏层几乎都用 ReLU。"],
ex:"z = −3：sigmoid ≈ 0.05，ReLU = 0，线性 = −3\nz = 2：sigmoid ≈ 0.88，ReLU = 2，线性 = 2\n预测房价（不能为负）输出层用 ReLU；预测明天涨跌幅（可正可负）用线性；预测是否垃圾邮件用 sigmoid。"});
D("ml-whyact",{a:"把很多块平板玻璃叠在一起，还是一块“平”的玻璃；只有中间加入弯曲的镜片，才能做出放大镜。激活函数就是那块弯镜片。",
s:["线性函数：y = ax + b，图像是直线。","两层线性叠加：y = c(ax + b) + d = (ca)x + (cb + d)，还是直线。","不管叠多少层，结果都等价于一层线性模型，“深”就白费了。","加入 ReLU 这类非线性函数，每层都能“折一下”，叠很多层就能拟合非常复杂的曲线。"],
ex:"第一层 y = 2x + 1，第二层 z = 3y − 2\n代入：z = 3(2x + 1) − 2 = 6x + 1\n两层合起来就是一层 6x + 1。"});
D("ml-softmax",{a:"选举投票：每个候选人有个得分，softmax 把得分换成“得票率”，所有人加起来正好 100%，得分高的占比更大。",
s:["输出层有 N 个神经元，每个算出一个分数 z₁, z₂, …, zₙ（叫 logits）。","每个分数取 e 的次方，全部变成正数。","每个除以总和，得到概率，加起来等于 1。","分数差越大，概率差距越明显。"],
ex:"z = [2, 1, 0]\ne^z ≈ [7.39, 2.72, 1.00]，总和 11.11\nsoftmax ≈ [0.67, 0.24, 0.09]\n第 1 类概率 67%，模型预测第 1 类。"});
D("ml-smloss",{a:"只看你给正确答案打了多少把握：正确答案是“猫”，你说猫的概率是 0.9，罚得少；只说 0.1，罚得多。",
s:["找出正确类别 y。","取出模型给这个类别的概率 a_y。","损失 = −log(a_y)。","其他类别的概率不直接出现在公式里，但因为加起来要等于 1，提高正确类的概率就会压低其他类。"],
ex:"接上例 softmax = [0.67, 0.24, 0.09]：\n正确答案是第 1 类：损失 = −log 0.67 ≈ 0.40\n正确答案是第 3 类：损失 = −log 0.09 ≈ 2.41"});
D("ml-multilabel",{a:"多类分类像单选题：只能选一个。多标签分类像多选题：可以同时选好几个。",
s:["多类：手写数字是 0–9 中的某一个，用 softmax，概率加起来为 1。","多标签：一张街景照片里可能同时有车、行人、公交，三个问题各自独立回答“是/否”。","多标签的输出层：每个标签一个神经元，各自用 sigmoid。","每个输出用二元交叉熵，三者相加。"],
ex:"街景照片输出 [车 0.95, 行人 0.80, 公交 0.10] → 有车、有行人、没有公交。三个数加起来不需要等于 1。"});
D("ml-adam",{a:"开车时自动调速：路直、方向一直没变就加速；路很弯、方向老在变就减速。Adam 给每个参数都配了一个这样的“自动档”。",
s:["普通梯度下降：所有参数共用一个固定学习率。","Adam 记录每个参数过去梯度的平均方向，方向一致就把步子加大。","同时记录梯度大小的平均，来回震荡大的参数步子自动变小。","结果：通常比普通梯度下降快很多，对学习率也没那么敏感。"],
ex:"TensorFlow 里写 optimizer=Adam(learning_rate=1e-3)，PyTorch 里写 torch.optim.Adam(params, lr=1e-3)。1e-3 就是 0.001，Adam 最常用的默认值。"});
D("ml-convlayer",{a:"全连接层像一个人看整张照片下结论；卷积层像派很多人，每人只盯着照片的一小块，看完再汇总。",
s:["全连接层：每个神经元连着上一层的所有输入。","卷积层：每个神经元只连着输入的一个小窗口。","好处：参数更少，计算更快，需要的训练数据更少，更不容易过拟合。","处理图像和心电图这类有空间或时间结构的数据特别好。"],
ex:"心电图有 100 个时间点。卷积层的每个神经元只看 20 个连续的点：第一个看 1–20，第二个看 11–30……这样就能识别局部的波形特征。"});
D("ml-tfsteps",{a:"和逻辑回归的三步完全对应，只是换成了框架里的写法。",
s:["Sequential：写出 f(x) 长什么样。","compile：告诉框架用什么损失。","fit：框架自动做前向、算损失、反向传播、更新参数，重复 epochs 次。"],
ex:"逻辑回归手写版：z = np.dot(w, x) + b → 损失 = −y log f − (1−y) log(1−f) → w = w − α·dw\n框架版：Dense(1, 'sigmoid') → BinaryCrossentropy() → model.fit()"});
D("ml-backprop",{a:"一张多米诺骨牌的连锁图：最后一块倒下（损失）是因为前面每一块都推了一下。反向传播就是从最后一块往回数，每一块“贡献”了多少。",
s:["前向时把每一步的计算画成计算图。","从损失开始往回走，每一步用链式法则算出“这个量变一点，损失变多少”。","一次反向就得到所有参数的梯度。","如果有 n 个节点、p 个参数，反向传播大约 n + p 步，而逐个求导要 n × p 步。"],
ex:"网络有 1 万个节点、10 万个参数：\n逐个算：约 10 亿步\n反向传播：约 11 万步"});
/* ML 2-3 */
D("ml-eval",{a:"老师出模拟题时不能用练习册上的原题，否则只能测出谁背了答案。测试集就是“没见过的新题”。",
s:["把数据随机打乱，切成两份，比如 70% 训练、30% 测试。","只用训练集学参数。","分别算训练误差 J_train 和测试误差 J_test。","J_test 才代表模型在新数据上的真实水平。分类问题还可以看“分错的比例”。"],
ex:"训练误差 2%，测试误差 15%：模型过拟合了，在新数据上远没有训练时那么好。"});
D("ml-cv",{a:"运动员选拔：训练集是平时训练，验证集是队内选拔赛（用来决定派谁去），测试集是正式比赛（只比一次，成绩才算数）。",
s:["训练集（如 60%）：学参数 w、b。","验证集（如 20%）：比较不同模型（多项式次数、网络大小、λ），选最好的。","测试集（如 20%）：最后只用一次，报告选中模型的真实成绩。","如果用测试集来挑模型，就等于在“比赛题”上反复练，成绩会虚高。"],
ex:"试 1 到 10 次多项式，每个都在训练集上训练，在验证集上算误差：\n次数 1：J_cv = 9.5\n次数 4：J_cv = 2.1（最小）\n次数 10：J_cv = 7.3\n选 4 次，再在测试集上报告误差 2.4。"});
D("ml-bv",{a:"打靶：高偏差是所有箭都偏向一边（瞄准方法就错了）；高方差是箭散落各处（手不稳，每次都不一样）。",
s:["看 J_train：如果很高，模型连训练数据都没学好 → 高偏差（欠拟合）。","看 J_cv 和 J_train 的差距：差距很大 → 高方差（过拟合）。","两个都低：模型很好。","两个问题可以同时存在：J_train 高，J_cv 还要高得多。"],
ex:"J_train = 15%，J_cv = 16% → 偏差问题（训练就不好）\nJ_train = 1%，J_cv = 15% → 方差问题（背答案）\nJ_train = 15%，J_cv = 30% → 两者都有"});
D("ml-baseline",{a:"语音识别 10% 的错误率算不算差？如果人类听这些嘈杂录音也错 10.6%，那已经很厉害了。没有参照物就没法判断好坏。",
s:["先定基准：人类水平、已有算法的成绩或经验值。","偏差 = J_train − 基准。","方差 = J_cv − J_train。","哪个差距大，就先解决哪个。"],
ex:"基准 10.6%，J_train 10.8%，J_cv 14.8%\n偏差 = 0.2%，方差 = 4.0% → 主要是方差问题\n基准 10.6%，J_train 15%，J_cv 15.5%\n偏差 = 4.4%，方差 = 0.5% → 主要是偏差问题"});
D("ml-lambda",{a:"λ 像家长管孩子的严格程度：太松孩子放飞（过拟合），太严孩子什么都不敢做（欠拟合），要找个中间值。",
s:["λ = 0：没有约束，复杂模型容易过拟合，J_train 低、J_cv 高。","λ 很大：所有 w 被压到接近 0，模型近似一条水平线，J_train 和 J_cv 都高。","在两者之间试一串 λ，每个都训练一次。","选 J_cv 最低的 λ。"],
ex:"λ 试 0, 0.01, 0.02, 0.04, 0.08, …, 10（每次翻倍）\nJ_cv：8.1, 5.2, 3.4, 2.6, 2.9, …, 12.0\n选 λ = 0.04。"});
D("ml-lc",{a:"学习曲线像看学生随做题量增多的成绩变化：如果方法本身不对（高偏差），做再多题也没用；如果只是见得少（高方差），多做题就会进步。",
s:["横轴：训练样本数 m；纵轴：误差。","J_train 通常随 m 增大而上升（越多越难全拟合）。","J_cv 通常随 m 增大而下降（见得多泛化好）。","高偏差：两条线很快汇合、变平，并且都高于基准 → 加数据没用，要换更强的模型。","高方差：两条线之间有大缺口，J_cv 还在下降 → 加数据有用。"],
ex:"m = 100：J_train 2%，J_cv 20%\nm = 1000：J_train 4%，J_cv 12%\nm = 10000：J_train 5%，J_cv 7%\n缺口在缩小，说明是方差问题，继续加数据会更好。"});
D("ml-bvfix",{a:"看病先诊断再开药：发烧要退烧药，骨折要打石膏。先判断是偏差还是方差，再选对应的办法。",
s:["高方差的药：收集更多数据、减少特征、增大 λ。","高偏差的药：增加特征、加多项式特征、减小 λ。","神经网络：高偏差 → 网络加大（更多层或更多神经元）；高方差 → 加数据。","大网络配合合适的正则化，通常不会比小网络差，只是更慢。"],
ex:"房价模型 J_train = 20%、基准 5% → 高偏差。别再去收集数据了，应该加特征（如学区、交通）或用更大的模型。"});
D("ml-loop",{a:"做菜：先按菜谱做一遍，尝一口，咸了加水、淡了加盐，再尝，反复调整。",
s:["选择架构：模型类型、特征、超参数。","训练模型。","诊断：看偏差方差、做误差分析。","根据诊断决定改什么，回到第 1 步。","一圈转得越快，项目进展越快。"],
ex:"垃圾邮件分类器：先用词频特征 + 逻辑回归 → 发现方差高 → 收集更多数据 → 误差分析发现钓鱼邮件漏得多 → 专门加“链接网址”特征 → 再训练……"});
D("ml-erran",{a:"考试后整理错题本：把错题按类型分好，发现一半错在“计算粗心”，那就先专门练计算。",
s:["从验证集里拿出模型分错的样本（比如 100 个）。","人工一个个看，给每个样本标上错误原因（可以多个）。","统计每种原因的数量。","优先解决占比最大的问题。","分错的样本太多时，随机抽 100–200 个看就够了。"],
ex:"500 个验证邮件里分错 100 个：\n钓鱼邮件 21 个，药品广告 3 个，故意拼错 7 个，图片里藏文字 18 个\n先解决钓鱼邮件和图片文字，药品广告不值得优先花时间。"});
D("ml-data",{a:"想教孩子认识各种角度的猫，但只有几张正面照片。你可以把照片旋转、放大、裁剪、调亮，变出很多张“新照片”。",
s:["有针对性地收集数据：误差分析发现哪类错得多，就多收集那类。","数据增强：对已有样本做合理的变形，生成新样本。","图像：旋转、缩放、裁剪、翻转、调亮度。","语音：加背景噪音、模拟电话音质。","变形要符合真实情况，加纯随机噪点往往没用。"],
ex:"手写字母 A 的图片：轻微旋转、扭曲 → 还是 A，有用。\n上下颠倒 → 现实中没人这么写，没用。\n一张图变出 20 张，训练数据就多了 20 倍。"});
D("ml-transfer",{a:"会骑自行车的人学骑摩托车很快，因为平衡感已经有了。迁移学习就是把一个任务学到的本事用到另一个任务上。",
s:["第一步（预训练）：在超大数据集上训练网络，比如 100 万张、1000 类的图片。","网络前面的层学会了通用特征：边缘、角、纹理、形状。","第二步（微调）：把输出层换成你自己的任务（比如 10 类手写数字）。","数据很少：只训练新的输出层；数据较多：所有层都稍微再训练一下。"],
ex:"你只有 1000 张手写数字图片，直接训练效果一般。\n下载一个在 ImageNet 上训练好的网络，换掉最后一层后用你的 1000 张图微调，准确率能高很多。"});
D("ml-cycle",{a:"开餐厅：定菜品（范围）→ 采购食材（数据）→ 试菜改菜（训练）→ 开张（部署）→ 根据顾客反馈持续调整（监控维护）。",
s:["定范围：决定要解决什么问题。","收集数据：定义并收集带标签的数据。","训练模型：训练、误差分析、迭代改进。","部署：上线给用户用。","监控和维护：真实数据会变化（比如流行语变了），要持续监控效果、更新模型。"],
ex:"语音识别上线后发现用户说了很多新的网络流行词，准确率下降 → 收集新数据 → 重新训练 → 再部署。"});
D("ml-pr",{a:"警察抓小偷：精确率是“抓来的人里真是小偷的比例”（别冤枉好人），召回率是“所有小偷里被抓到的比例”（别放过坏人）。",
s:["先画一个 2×2 表：预测（是/否）× 实际（是/否）。","TP：预测是、实际是。FP：预测是、实际不是（误报）。FN：预测不是、实际是（漏报）。","精确率 = TP / (TP + FP)：说“是”的里面有多少对了。","召回率 = TP / (TP + FN)：真正“是”的里面找出了多少。","正例很稀少时，准确率没意义，要看这两个。"],
ex:"1000 人里 10 人有病。模型预测 15 人有病，其中 8 人真有病：\nTP = 8，FP = 7，FN = 2\n精确率 = 8 / 15 ≈ 53%\n召回率 = 8 / 10 = 80%"});
D("ml-f1",{a:"F1 像“木桶效应”：两块木板一长一短，能装多少水取决于短的那块。",
s:["阈值调高：只在很有把握时才说“是” → 精确率高、召回率低。","阈值调低：稍有怀疑就说“是” → 召回率高、精确率低。","需要一个数来比较不同模型时，用 F1 = 2PR / (P + R)。","简单平均会被一个高分掩盖，F1 不会。"],
ex:"模型 A：P = 0.5，R = 0.4，F1 ≈ 0.44\n模型 B：P = 0.7，R = 0.1，F1 ≈ 0.18\n模型 C：P = 0.02，R = 1.0，F1 ≈ 0.04（永远说“是”）\n简单平均 C 是 0.51 最高，但 F1 正确地指出 A 最好。"});
D("ml-modelsel",{a:"选秀节目：海选（训练）、复赛（验证集选人）、决赛（测试集定成绩）。",
s:["列出候选模型。","每个都在训练集上训练。","在验证集上算误差，选最低的。","用测试集评估选出的那一个，只评一次。"],
ex:"网络大小选 [25,15,1]、[20,12,12,1]、[32,16,8,4,12,1] 三种，验证误差分别 8%、6%、7%，选第二种，测试误差 6.5%。"});
D("ml-skewdata",{a:"想训练识别各种字体的文字，但真实照片很难收集。电脑里有几百种字体，可以直接“打印”出各种文字图片来训练。",
s:["用程序生成：选字体、颜色、背景、旋转角度。","生成的图片自带正确标签（因为是你写进去的字）。","几乎零成本得到海量数据。","要让合成数据尽量接近真实数据，否则效果有限。"],
ex:"用 200 种字体 × 26 个字母 × 10 种背景 × 5 种角度 = 26 万张训练图片。"});
/* ML 2-4 */
D("ml-tree",{a:"医生问诊：“发烧吗？”→ 是 →“咳嗽吗？”→ 是 →“可能是感冒”。每个问题把病人分成两组，一路问下去就得出结论。",
s:["根节点：第一个问题，比如“耳朵是尖的吗？”","根据答案走左边或右边。","中间节点：继续问下一个问题。","叶子节点：不再问了，给出预测（猫/不是猫）。","训练决策树 = 决定每个节点问什么问题、什么时候停。"],
ex:"判断是不是猫：\n耳朵尖？→ 是 → 脸圆？→ 是 → 猫\n                     → 否 → 不是猫\n          → 否 → 有胡须？→ 是 → 猫 / 否 → 不是猫"});
D("ml-entropy",{a:"一袋糖：全是草莓味，你一摸就知道是什么（熵 = 0，很纯）；草莓和柠檬各一半，你完全猜不到（熵 = 1，最乱）。",
s:["p = 这组里猫的比例。","p = 0 或 1：全是一类，熵 = 0。","p = 0.5：一半一半，熵 = 1，最混乱。","其他情况介于 0 到 1 之间。","公式：H = −p log₂p − (1−p) log₂(1−p)，规定 0·log0 = 0。"],
ex:"6 只动物里 3 只猫：p = 0.5，H = 1\n6 只里 5 只猫：p ≈ 0.83，H ≈ −0.83×log₂0.83 − 0.17×log₂0.17 ≈ 0.65\n6 只里 6 只猫：H = 0"});
D("ml-ig",{a:"问一个好问题能让局面一下子明朗。信息增益就是衡量“问完这个问题后，混乱程度降低了多少”。",
s:["算出分之前的熵 H(根)。","用某个特征分成左右两组，分别算熵 H(左)、H(右)。","按样本数比例加权平均：w左·H(左) + w右·H(右)。","信息增益 = H(根) − 加权平均。","每个特征都算一遍，选增益最大的。"],
ex:"10 只动物，5 只猫，H(根) = 1\n按“耳朵尖”分：左 5 只（4 猫），右 5 只（1 猫）\nH(左) = H(0.8) ≈ 0.72，H(右) = H(0.2) ≈ 0.72\n加权 = 0.5×0.72 + 0.5×0.72 = 0.72\n增益 = 1 − 0.72 = 0.28\n再算“脸圆”“有胡须”的增益，选最大的那个。"});
D("ml-build",{a:"切蛋糕分组：先切一刀分成两块，再对每一块单独决定怎么切，一直切到每块都“纯”了或太小了。",
s:["从根节点开始，用所有训练样本。","算每个特征的信息增益，选最大的作为这个节点的问题。","按答案把样本分到左右两个子节点。","对每个子节点重复以上过程（递归）。","满足停止条件就变成叶子：节点全是同一类、深度到上限、增益太小、样本太少。"],
ex:"最大深度设为 2：根节点问一个问题，左右子节点各再问一个问题，然后全部变成叶子，最多 4 个叶子。限制深度能防止树长得太复杂而过拟合。"});
D("ml-onehot",{a:"问卷里“你喜欢的颜色：红/绿/蓝”，可以拆成三道是非题：“喜欢红吗？”“喜欢绿吗？”“喜欢蓝吗？”，每人只有一个“是”。",
s:["类别特征有 k 个取值，就拆成 k 个 0/1 特征。","每个样本只有一个位置是 1（所以叫 one-hot，独热）。","这样决策树、逻辑回归、神经网络都能直接用。","连续特征（如体重）：尝试多个切分点，选信息增益最大的那个作为“体重 ≤ ? ”的问题。"],
ex:"耳朵形状：尖 → [1, 0, 0]，软 → [0, 1, 0]，椭圆 → [0, 0, 1]\n体重有 8.8, 9.2, 10.2, 15, 18 kg 等取值，试切分点 9、10、12……发现“≤ 9 kg”增益最大，就用它。"});
D("ml-regtree",{a:"不是投票选类别，而是“取平均”：叶子里有几只动物，就用它们的平均体重作为预测。",
s:["叶子节点的预测 = 落在这个叶子的样本 y 的平均值。","选特征时不看熵，而看“方差减少了多少”。","方差小说明叶子里的数值很接近，平均值预测更准。"],
ex:"叶子里 3 只动物体重 7.2, 8.4, 7.6 kg，预测新动物体重 = 平均 7.73 kg。"});
D("ml-ensemble",{a:"一个专家可能看走眼，请 100 个专家投票，少数人的失误会被抵消。",
s:["单棵决策树很不稳定：换掉一个训练样本，根节点可能就选了完全不同的特征。","解决办法：训练很多棵不同的树。","预测时让所有树投票（分类）或取平均（回归）。","有放回抽样：从 m 个样本里随机抽 m 次，可以重复抽到同一个，每棵树用一份这样抽出的数据。"],
ex:"10 个样本有放回抽 10 次，可能抽到：3, 7, 7, 1, 9, 3, 5, 2, 7, 10。样本 7 出现 3 次，样本 4、6、8 没被抽到。每棵树用这样一份略有不同的数据。"});
D("ml-rf",{a:"让 100 个人分别只看问卷的一部分问题来做判断，大家的视角就不一样，集体投票更全面。",
s:["对 B 棵树（如 100 棵）重复：用有放回抽样得到一份数据。","建树时，每个节点只从随机挑的 k 个特征里选最好的（k ≈ √n）。","这让树之间差异更大，投票时互相纠错的效果更好。","树的数量增加到一定程度后，效果就不再明显提高。"],
ex:"有 100 个特征，每个节点随机挑 10 个来比较，100 棵树投票：60 棵说“是猫”，40 棵说“不是”→ 预测是猫。"});
D("ml-xgb",{a:"学生复习：第一遍全部看一遍，然后重点做错题；再错的题再重点练。XGBoost 每棵新树都专攻前面做错的样本。",
s:["第一棵树正常训练。","找出它预测错的样本，增加这些样本的权重。","第二棵树更加关注这些难样本。","一直重复，最后把所有树的预测组合起来。","XGBoost 是这个思路的高效实现，自带正则化，速度快、效果好。"],
ex:"from xgboost import XGBClassifier\nmodel = XGBClassifier()\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test)"});
D("ml-treevsnn",{a:"处理 Excel 表格选树模型，处理照片、声音、文字选神经网络。",
s:["结构化数据（表格，每列一个特征）：树集成通常又快又准。","非结构化数据（图片、音频、文本）：神经网络效果最好。","神经网络能迁移学习、能和其他网络连接组合。","决策树训练快，小树可以画出来解释给别人听。"],
ex:"预测贷款违约（年龄、收入、负债率……）→ XGBoost\n识别 X 光片里的肺炎 → 卷积神经网络"});
D("ml-treeprobs",{a:"一棵树像一个固执的人，换个说法问他可能给出完全不同的答案；一片森林像一个委员会，意见更稳定。",
s:["优点：训练快，不需要特征缩放，能处理类别特征。","小树可以画出来，直观好解释。","缺点：对数据变化很敏感，容易过拟合。","实际中几乎总是用树集成代替单棵树。"],
ex:"信贷审批要向客户解释为什么被拒，深度 3 的小决策树可以直接说清“收入 < 5000 且负债率 > 50% 所以拒绝”。"});
/* 详细讲解：ML 第 3 门 */
D("ml-cluster",{a:"把一盒混在一起的纽扣按颜色、大小分成几堆，没人告诉你该怎么分，你看着相似的就放一起。",
s:["数据没有标签，只有特征。","算法根据样本之间的距离（相似程度）把它们分组。","每一组叫一个“簇”。","分完后由人来解释每一簇代表什么。"],
ex:"把 1000 篇新闻按词频聚成 5 簇，人工一看：体育、财经、科技、娱乐、国际。"});
D("ml-kmeans",{a:"选 K 个“班长”，每个同学站到离自己最近的班长身边；然后每个班长走到自己队伍的正中间；同学们再重新选最近的班长……直到队伍不再变化。",
s:["随机选 K 个点作为初始中心。","分配：每个样本归到最近的中心。","移动：每个中心移到它这组样本的平均位置。","重复分配和移动，直到中心不再移动（收敛）。"],
ex:"一维数据 1, 2, 3, 10, 11, 12，K = 2，初始中心 1 和 2：\n分配：{1} 归中心 1，{2, 3, 10, 11, 12} 归中心 2\n移动：中心变成 1 和 7.6\n再分配：{1, 2, 3} 和 {10, 11, 12}\n移动：中心变成 2 和 11，之后不再变化，完成。"});
D("ml-kmcost",{a:"每个同学到自己班长的距离平方的平均值，叫“失真”，越小说明分得越紧凑。",
s:["对每个样本，算它到所属中心的距离平方。","全部取平均，就是代价 J。","分配步骤和移动步骤都只会让 J 变小或不变。","所以 J 随迭代一定单调下降；如果上升了，代码有 bug。"],
ex:"上例最后：{1,2,3} 到 2 的距离平方 1, 0, 1；{10,11,12} 到 11 的距离平方 1, 0, 1\nJ = 4 / 6 ≈ 0.67"});
D("ml-kminit",{a:"开局位置不好，可能一直困在一个不太好的分组里。多换几次开局，选最好的那次。",
s:["初始化：从样本里随机挑 K 个作为中心。","运行 K-means 直到收敛，记下代价 J。","重复 50–1000 次（每次随机初始化不同）。","选 J 最小的那次结果。","选 K：可以画 J 随 K 的曲线找“肘部”，但更实用的是根据实际用途选。"],
ex:"做 T 恤尺码：K = 3 对应 S/M/L，K = 5 对应 XS/S/M/L/XL。K = 5 更合身，但生产成本更高，按业务需要选。"});
D("ml-anomaly",{a:"银行看你的消费习惯：平时都在上海几百元消费，突然凌晨在国外刷了 5 万，系统就会觉得“不正常”。",
s:["只用正常样本训练，学会“正常是什么样”。","对新样本算它出现的概率 p(x)。","p(x) 很小，说明它和正常数据差得远，判为异常。","阈值 ε 决定多小算异常。"],
ex:"飞机发动机：用 1 万台合格发动机的发热量和振动数据建模。新发动机的数据落在“很少见”的区域，就送去人工检查。"});
D("ml-gauss",{a:"全班身高的分布：大部分人在平均值附近，特别高和特别矮的人很少，画出来是一个钟形。",
s:["μ（均值）决定钟的中心在哪。","σ（标准差）决定钟的宽窄：σ 小就又高又窄，σ 大就又矮又宽。","大约 68% 的数据在 μ ± σ 之内，95% 在 μ ± 2σ 之内。","离中心越远，概率密度越小。"],
ex:"身高 μ = 170 cm，σ = 6 cm：\n164–176 cm 约占 68%\n158–182 cm 约占 95%\n195 cm 离中心 4 个 σ 以上，非常少见。"});
D("ml-adalgo",{a:"体检报告每一项都有正常范围。每项单独看概率，再乘起来：几项都只是有点偏，乘起来可能就很低，说明整体异常。",
s:["选择可能和异常有关的 n 个特征。","对每个特征 j，用训练数据算 μⱼ 和 σⱼ²。","新样本来了，每个特征各算一个高斯概率。","把 n 个概率相乘得到 p(x)。","p(x) < ε 就标为异常。"],
ex:"发热量 x₁：μ = 50，σ = 5；振动 x₂：μ = 3，σ = 0.5\n新发动机 x₁ = 52，x₂ = 4.6\nx₁ 很正常（概率较高），x₂ 偏离 3.2 个 σ（概率很低）\n乘起来 p(x) 很小 → 判为异常。"});
D("ml-advssup",{a:"防小偷：如果每次小偷的手法都不一样，与其记住所有手法，不如记住“正常住户长什么样”，不像住户的就报警。",
s:["异常样本很少（0–20 个），正常样本很多 → 异常检测。","未来的异常可能和以前见过的完全不同 → 异常检测。","正负样本都很多，未来的正样本和训练时的类似 → 监督学习。"],
ex:"信用卡盗刷：手段不断翻新 → 异常检测\n垃圾邮件：类型比较稳定、标注数据多 → 监督学习\n天气预报：有大量历史数据 → 监督学习"});
D("ml-adeval",{a:"出一张“验证卷”：大部分是正常样本，混进几个已知的异常，看系统能找出几个。",
s:["训练集：6000 台正常发动机（可以混进极少量异常，不影响）。","验证集：2000 台正常 + 10 台异常。","测试集：2000 台正常 + 10 台异常。","用验证集调 ε 和选特征，用测试集最后评估。","因为异常很少，用精确率、召回率、F1 评价。"],
ex:"ε = 0.02 时，验证集 10 台异常找出 8 台，误报 5 台：召回 80%，精确率 8/13 ≈ 62%。"});
D("ml-adfeat",{a:"检测人员发现一个异常没被抓住，就研究它和正常样本哪里不一样，造一个能抓住它的新指标。",
s:["画每个特征的直方图，不像钟形的就做变换（log、开根号）。","找出漏掉的异常样本，仔细看它的特征。","想一个新特征，让这个异常的值变得很极端。","加进模型，重新评估。"],
ex:"服务器监控：CPU 负载 0.9（高但见过），网络流量 10（低也见过），单看都不异常。\n新特征 CPU / 流量 = 0.09，比正常值高得多 → 抓住了“程序卡死在死循环”的异常。"});
/* ML 3-2 */
D("ml-recsys",{a:"一张巨大的表格：行是电影，列是用户，格子里是评分，大部分格子是空的（没看过）。推荐系统就是去猜这些空格。",
s:["n_u：用户数，n_m：电影数。","r(i,j) = 1 表示用户 j 给电影 i 打过分。","y(i,j)：打的分数（如 0–5 星）。","任务：预测所有 r(i,j) = 0 的格子，把预测分高的推荐给用户。"],
ex:"Alice 给《爱在黎明》5 星、《速度与激情》0 星，没看过《真爱至上》。系统预测她会打 4.9 星，就推荐给她。"});
D("ml-cbcf",{a:"推荐电影两种思路：①“这部是爱情片，你爱看爱情片”（基于内容）；②“和你口味很像的人都爱看这部”（协同过滤）。",
s:["基于内容：需要物品的特征（类型、演员）和用户的特征（年龄、偏好），算它们有多匹配。","协同过滤：不需要知道电影是什么类型，只靠大家的打分记录找规律。","两者可以结合使用。"],
ex:"新电影刚上映没人打过分：只能用基于内容（知道它是爱情片）。\n老电影打分很多：协同过滤往往更准。"});
D("ml-cf",{a:"侦探推理：不知道每部电影的“浪漫程度”，但看到喜欢浪漫片的人都给它高分，就能反推出它很浪漫；同时也能反推出每个人有多爱浪漫片。",
s:["每部电影有一个特征向量 x⁽ⁱ⁾（比如 [浪漫程度, 动作程度]），开始时不知道。","每个用户有一个偏好向量 w⁽ʲ⁾ 和 b⁽ʲ⁾。","预测评分 = w⁽ʲ⁾·x⁽ⁱ⁾ + b⁽ʲ⁾。","代价函数：所有打过分的格子的误差平方和，加上 w 和 x 的正则项。","同时对 w、b、x 做梯度下降，一起学出来。"],
ex:"学到某用户 w = [5, 0]（只爱浪漫），某电影 x = [0.9, 0]（很浪漫）\n预测评分 = 5 × 0.9 + 0 = 4.5 星"});
D("ml-binary",{a:"抖音不知道你给视频打几分，只知道你有没有看完、点赞、收藏，这就是“是/否”标签。",
s:["标签变成 1（喜欢/点击）、0（不喜欢/没点）、?（没看到）。","预测 = sigmoid(w·x + b)，表示喜欢的概率。","代价函数换成二元交叉熵。","其余和协同过滤一样。"],
ex:"用户看了视频 30 秒以上 → 1；划过去 → 0；没刷到 → ?。预测概率 0.8 以上的视频优先推给他。"});
D("ml-meannorm",{a:"新来的同学还没给任何电影打分，与其猜他“全部打 0 分”，不如猜他“和大家平均一样”。",
s:["算每部电影的平均分 μᵢ。","把所有评分减去所在电影的平均分。","用减完的数据训练协同过滤。","预测时再把平均分加回来：w·x + b + μᵢ。","新用户的 w 被正则化压成 0，预测就等于平均分，很合理。"],
ex:"《真爱至上》平均 2.5 星。新用户 Eve 没打过分，w = 0、b = 0 → 预测 0 + 2.5 = 2.5 星，而不是 0 星。"});
D("ml-similar",{a:"两部电影的“特征指纹”越接近，就越相似。“看过这部的人也喜欢……”就是这么来的。",
s:["每部电影都学到了一个特征向量 x⁽ⁱ⁾。","两部电影的距离 = ‖x⁽ᵏ⁾ − x⁽ⁱ⁾‖²。","找距离最小的几部，作为相似推荐。","局限：新电影、新用户没有数据（冷启动），而且很难用上类型、年龄等额外信息。"],
ex:"电影 A 的 x = [0.9, 0.1]，B = [0.85, 0.15]，C = [0.1, 0.9]\nA 和 B 的距离很小，A 和 C 很大 → 看过 A 的人推荐 B。"});
D("ml-cbdl",{a:"给用户和电影都做一张“名片”（向量），名片越匹配越推荐。两个神经网络分别负责“做名片”。",
s:["用户网络：输入用户信息（年龄、观看历史），输出向量 v_u。","电影网络：输入电影信息（类型、年份），输出向量 v_m。","预测喜欢程度 = v_u · v_m。","两个网络一起训练。","电影向量可以提前算好存起来，用户来了只要算一次点积，非常快。"],
ex:"上百万部电影时分两步：\n检索：快速找出和用户向量最近的几百部候选\n排序：用完整模型给这几百部精确打分，选前 10 部"});
D("ml-recethic",{a:"推荐系统像一个很会讨好人的服务员：如果它只关心你会不会多停留，可能一直给你端“垃圾食品”。",
s:["目标可以是：用户最可能喜欢的、最可能购买的、最赚钱的、最能留住人的。","只追求点击和停留时间，可能放大极端、耸动、误导的内容。","设计时要考虑长期对用户和社会的影响。","保持透明，过滤有害内容。"],
ex:"短视频平台只优化“观看时长”，可能越推越极端。改成同时考虑内容质量和用户满意度会更健康。"});
D("ml-pca",{a:"拍一个茶壶的照片：从侧面拍能看出最多细节，从正上方拍只看到一个圆。PCA 就是自动找“最能看清全貌的拍摄角度”。",
s:["数据有很多特征，很多特征之间高度相关。","PCA 找到一个新的坐标轴方向，使数据投影上去后分布得最开（保留信息最多）。","再找第二个方向（和第一个垂直），以此类推。","只保留前 2–3 个方向，就能把高维数据画在平面上。"],
ex:"每个国家有 50 个指标（GDP、人均收入、寿命……），用 PCA 压成 2 个数，画在图上，发达国家聚在一块，发展中国家聚在另一块。"});
D("ml-cfgd",{a:"框架的自动求导像一台“万能求导机”：你只要写出代价函数怎么算，它自动给出梯度，不管是不是神经网络。",
s:["用 GradientTape 记录代价函数的计算过程。","tape.gradient 自动求出对 X、W、b 的梯度。","用 Adam 优化器更新参数。","重复很多轮。"],
ex:"PyTorch 版本思路一样：\ncost = cofi_cost(X, W, b, Y, R, lam)\ncost.backward()\nopt.step()"});
/* ML 3-3 */
D("ml-rl",{a:"训练小狗握手：它做对了就给零食，做错了就不给。你不用告诉它每块肌肉怎么动，它自己琢磨出怎么才能拿到零食。",
s:["智能体（agent）：做决定的一方，比如机器人、游戏 AI。","状态 s：当前的情况。","动作 a：智能体能做的选择。","奖励 R：做完动作后得到的分数，可正可负。","目标：学会在每个状态选动作，让长期总奖励最大。"],
ex:"火星车在 6 个格子的走廊里，最左边格子奖励 100，最右边奖励 40，中间都是 0。它要学会从任何位置出发，往哪边走能拿到最多奖励。"});
D("ml-return",{a:"今天给你 100 元，还是一年后给你 100 元？大多数人选今天。折扣因子 γ 就是“未来的钱打几折”。",
s:["回报 = 第一步奖励 + γ × 第二步奖励 + γ² × 第三步奖励 + ……","γ 在 0 到 1 之间，常用 0.9 或 0.99。","γ 越小，越看重眼前；γ 越接近 1，越有耐心。","负奖励（惩罚）也会打折，所以智能体会倾向于把惩罚往后推。"],
ex:"火星车从格子 4 往左走：奖励序列 0, 0, 0, 100，γ = 0.5\n回报 = 0 + 0.5×0 + 0.25×0 + 0.125×100 = 12.5\n往右走：0, 0, 40\n回报 = 0 + 0 + 0.25×40 = 10\n往左更好。"});
D("ml-policy",{a:"策略就是一本“行动手册”：遇到什么情况就怎么做。",
s:["策略 π(s) = a：在状态 s 选择动作 a。","强化学习的目标：找到让回报最大的策略。","马尔可夫决策过程（MDP）：状态、动作、奖励、折扣因子、状态怎么转移，这五样描述了整个问题。","马尔可夫性：下一步只取决于现在，跟过去怎么走到这里无关。"],
ex:"火星车的一种策略：π(2) = 左，π(3) = 左，π(4) = 左，π(5) = 右。在 5 号格子离右边终点更近，所以往右。"});
D("ml-q",{a:"Q(s, a) 像一张攻略表：“在这个位置做这个动作，之后一直按最优方式玩，最终能拿多少分”。",
s:["在状态 s 先做动作 a。","之后都按最优策略行动。","累计得到的回报就是 Q(s, a)。","有了 Q 表，最优动作就是 Q 最大的那个。","状态的最优价值 = max 各动作的 Q。"],
ex:"γ = 0.5，火星车在格子 2：\nQ(2, 左) = 0 + 0.5×100 = 50\nQ(2, 右) = 0 + 0.5×0 + 0.25×0 + 0.125×100 = 12.5（往右一步再回头往左）\n所以在格子 2 应该往左。"});
D("ml-bellman",{a:"“从这里出发的最好成绩” = “这一步拿到的分” + 打折后的“下一个位置出发的最好成绩”。大问题被拆成一步 + 剩下的。",
s:["当前状态 s，做动作 a，得到奖励 R(s)，进入新状态 s′。","在 s′，选最好的动作 a′，得到 max Q(s′, a′)。","Q(s, a) = R(s) + γ × max Q(s′, a′)。","在随机环境里（动作不一定成功），把后半部分换成期望值（平均）。"],
ex:"γ = 0.5，Q(3, 左) = R(3) + 0.5 × max Q(2, ·) = 0 + 0.5 × 50 = 25\n和直接算一致：0 + 0.5×0 + 0.25×100 = 25"});
D("ml-dqn",{a:"状态太多，攻略表写不下（月球着陆器的速度、角度都是连续的小数）。那就训练一个神经网络当“攻略查询机”：输入状态，输出每个动作的 Q 值。",
s:["网络输入：状态 s（8 个数）。","网络输出：4 个动作各自的 Q 值。","让智能体随机玩很多次，存下 (s, a, R, s′)。","用贝尔曼方程造训练标签：y = R + γ × max Q(s′, a′)（用当前网络估计）。","像监督学习一样，让 Q(s, a) 去拟合 y，反复迭代。"],
ex:"存了 1 万条经验，每次训练取出来造 1 万个 (输入, 标签) 对，训练网络，再用新网络去玩、去造新标签……一圈圈变好。"});
D("ml-eps",{a:"去餐馆点菜：大部分时候点最爱吃的（利用），偶尔尝尝新菜（探索），说不定发现更好吃的。",
s:["以 1 − ε 的概率选当前 Q 值最大的动作（贪心）。","以 ε 的概率随机选一个动作（探索）。","开始时 ε 大（如 1.0），多探索；慢慢减小到 0.01，多利用。","mini-batch：每次只用一小部分经验训练，加快速度。","软更新：新参数 = 0.01 × 新算出的 + 0.99 × 旧的，让目标变化平缓，训练更稳定。"],
ex:"ε = 0.05：100 次决策里，大约 95 次选最好的动作，5 次随便试。"});
D("ml-lunar",{a:"像在手机上玩一个降落游戏：控制几个推进器，让飞船稳稳停在两面旗子中间。",
s:["状态：x、y 位置，x、y 速度，倾斜角度，角速度，左腿着地，右腿着地（8 个数）。","动作：什么都不做、左推进器、主推进器、右推进器。","奖励：平稳着陆 +100～140，坠毁 −100，每条腿着地 +10，开主推进器 −0.3（耗燃料）。","训练一个 DQN 学会着陆。"],
ex:"网络 8 → 64 → 64 → 4，输出 4 个动作的 Q 值，比如 [12.3, 8.1, 25.6, 9.0]，选第 3 个：开主推进器。"});
D("ml-rllimit",{a:"在模拟游戏里练得再好，到现实中风也不一样、地也不一样，机器人可能还是会摔倒。",
s:["模拟器里成功容易，真实世界难得多。","需要大量试错，真实机器人试错成本很高。","目前实际应用比监督学习少。","但 RLHF（用人类反馈的强化学习）是让 ChatGPT、Claude 这类大模型更有用、更安全的关键步骤之一。"],
ex:"大模型对齐：让人给模型的两个回答排个好坏，训练一个“打分模型”，再用强化学习让大模型多生成高分回答。"});
/* 详细讲解：Python 基础、流程控制、函数 */
D("py-run",{a:"交互模式像和计算器对话，按一下回车就出一个结果；脚本文件像写好一整份菜谱交给厨师，从头做到尾；Jupyter 像带格子的笔记本，可以一格一格地做，每格的结果就显示在下面。",
s:["交互模式：在终端输入 `python`，看到 `>>>` 就可以一行行输入，回车立刻出结果。适合试一个小东西。","脚本文件：把代码写进 `train.py`，在终端运行 `python train.py`，从第一行执行到最后一行。适合完整程序。","Jupyter / Colab：代码分成很多“单元格”，Shift + Enter 运行当前格。变量在格子之间共享。适合边学边试、画图。","注意：交互模式里写个变量名就会显示它的值；脚本里必须用 `print()` 才会显示。"],
ex:"交互模式：\n>>> x = 3\n>>> x * 2\n6\n同样的内容写进 a.py 再运行：什么也不显示\n要改成 print(x * 2) 才会输出 6。"});
D("py-var",{a:"变量像贴在盒子上的便利贴。`x = 10` 是把写着 x 的便利贴贴到装着 10 的盒子上。`x = x + 1` 是先看 x 现在贴着谁（10），算出 11，再把便利贴撕下来贴到 11 上。",
s:["`=` 不是数学里的“等于”，而是“赋值”：先算右边，再把结果交给左边的名字。","变量名可以用字母、数字、下划线，不能以数字开头，区分大小写。","算术：`+ - * /`，`/` 的结果永远是小数。","`//` 是整除（向下取整），`%` 是取余数，`**` 是乘方。","简写：`x += 1` 等于 `x = x + 1`。"],
ex:"x = 7，y = 2\nx / y → 3.5\nx // y → 3（7 里面有 3 个 2）\nx % y → 1（还剩 1）\nx ** y → 49\nx += 3 → x 变成 10"});
D("py-type",{a:"同样是“5”，可以是数字 5，也可以是写在纸上的字“5”。数字能做加法，字只能拼接。type() 就是问 Python：“这个东西到底是哪一种？”",
s:["int：整数，如 3、−7。","float：小数，如 2.5、1e-3（就是 0.001）。","str：字符串，用引号包起来，如 'hi'。","bool：只有 True 和 False。","转换：`int('42')` 变整数，`float('3.5')` 变小数，`str(10)` 变字符串。","不同类型混用会报错，比如 `'年龄' + 20` 会出 TypeError，要写成 `'年龄' + str(20)`。"],
ex:"'5' + '5' → '55'（字符串拼接）\n5 + 5 → 10\nint('5') + 5 → 10\ntype(3 / 1) → float（除法结果总是小数 3.0）\nint(3.9) → 3（直接砍掉小数，不是四舍五入）"});
D("py-str",{a:"f-string 像一张填空表格：“___ 的成绩是 ___ 分”，你把变量塞进 {} 里，Python 自动帮你填好。",
s:["字符串用单引号或双引号都行：'abc' 和 “abc” 一样。","f-string：在引号前加 f，里面用 {变量} 插入值。","控制小数位数：{loss:.4f} 表示保留 4 位小数。","下标取字符：s[0] 是第一个字符，s[-1] 是最后一个。","切分：`'a b c'.split()` 按空格切成列表。","长度：len(s)。"],
ex:"name = 'Cedric'，acc = 0.98765\nf'{name} 准确率 {acc:.2%}' → 'Cedric 准确率 98.77%'\nf'{acc:.3f}' → '0.988'\n'2026-11-18'.split('-') → ['2026', '11', '18']"});
D("py-strm",{a:"字符串就像一段文字，自带一个工具箱：剪刀（split）、橡皮（strip）、修正液（replace）、胶水（join）。用法都是“字符串.工具名()”。",
s:["strip()：去掉两端的空格和换行，读文件、读输入时常用。","replace(旧, 新)：替换所有出现的地方。","lower() / upper()：转小写 / 大写，比较时忽略大小写很有用。","'连接符'.join(列表)：把一串字符串用连接符拼起来。","find(子串)：返回第一次出现的位置，找不到返回 −1；`in` 判断是否包含。","字符串不能原地修改，这些方法都是返回一个新字符串，原来的不变。"],
ex:"s = '  Cat,Dog  '\ns.strip() → 'Cat,Dog'\ns.strip().split(',') → ['Cat', 'Dog']\n'-'.join(['2026', '11', '18']) → '2026-11-18'\n'Dog' in s → True\ns.lower() 之后 s 本身没变，要写 s = s.lower() 才会更新。"});
D("py-list",{a:"列表像一排带编号的储物柜，编号从 0 开始。切片 a[1:3] 是“从 1 号柜开始拿，拿到 3 号之前停”，所以拿到的是 1 号和 2 号。",
s:["创建：a = [10, 20, 30, 40]。","下标从 0 开始：a[0] 是 10。负数从后往前数：a[-1] 是 40。","切片 a[开始:结束]：包含开始，不包含结束。省略开始表示从头，省略结束表示到尾。","a[::2] 每隔一个取一个，a[::-1] 倒过来。","列表可以修改：a[0] = 99。","len(a) 是元素个数，下标超出范围会报 IndexError。"],
ex:"a = [10, 20, 30, 40, 50]\na[1:3] → [20, 30]\na[:2] → [10, 20]\na[-2:] → [40, 50]（最后两个）\na[::-1] → [50, 40, 30, 20, 10]\na[5] → IndexError（最大下标是 4）"});
D("py-listop",{a:"列表像一条排队的队伍：append 是排到队尾，insert 是插队，pop 是队尾的人离开，remove 是点名让某人离开，sort 是按身高重新排。",
s:["append(x)：在末尾加一个元素。","insert(i, x)：在下标 i 前插入。","pop()：删掉并返回最后一个；pop(i) 删第 i 个。","remove(x)：删掉第一个值等于 x 的元素。","a.sort() 原地排序（a 被改变，返回 None）；sorted(a) 返回新列表，a 不变。","sum、max、min、len 直接算统计量。"],
ex:"a = [3, 1, 2]\na.append(5) → [3, 1, 2, 5]\nx = a.pop() → x = 5，a = [3, 1, 2]\nb = sorted(a) → b = [1, 2, 3]，a 还是 [3, 1, 2]\na = a.sort() → a 变成 None（常见错误！）"});
D("py-nested",{a:"嵌套列表就是一张表格：外层列表是“一排排行”，每一行本身又是一个列表。m[1][2] 是“先找第 1 行，再在这一行里找第 2 个”。",
s:["m = [[1, 2, 3], [4, 5, 6]] 是 2 行 3 列。","m[1] 取出第 1 行：[4, 5, 6]。","m[1][2] 再取这一行的第 2 个：6。","行数 len(m)，列数 len(m[0])。","遍历：外层 for 拿行，内层 for 拿每个元素。","取一整列要写循环：[row[0] for row in m]。这也是为什么后面要用 NumPy：它能直接写 m[:, 0]。"],
ex:"m = [[1, 2, 3],\n     [4, 5, 6]]\nm[0][1] → 2\nm[1] → [4, 5, 6]\n[row[2] for row in m] → [3, 6]\n总和：sum(sum(row) for row in m) → 21"});
D("py-dict",{a:"字典像通讯录：用名字（键）查电话（值）。列表要用编号找东西，字典直接用有意义的名字找，而且再大也是一下就查到。",
s:["创建：d = {'name': 'Cedric', 'age': 20}，键和值用冒号连接。","取值：d['age']。键不存在会报 KeyError。","安全取值：d.get('major', '未知')，不存在时返回默认值。","新增或修改：d['major'] = 'AI'。","遍历：for k, v in d.items()。只要键用 d.keys()，只要值用 d.values()。","判断有没有某个键：'age' in d。"],
ex:"count = {}\n统计 ['猫', '狗', '猫']：\n第 1 个：count['猫'] = count.get('猫', 0) + 1 → {'猫': 1}\n第 2 个：{'猫': 1, '狗': 1}\n第 3 个：{'猫': 2, '狗': 1}\n鱼书里网络参数就存成字典：params['W1']、params['b1']。"});
D("py-tuple",{a:"元组像一个封好的信封：里面装了几样东西，装好后就不能再换。好处是安全，没人能偷偷改；而且可以一次把里面的东西分给几个人（解包）。",
s:["用圆括号：p = (3, 4)。只有一个元素要写 (5,)，逗号不能少。","可以用下标读：p[0]，但不能改：p[0] = 1 会报错。","解包：x, y = p，一次给多个变量赋值。","交换变量：a, b = b, a，不需要临时变量。","函数返回多个值时，其实返回的是一个元组。","NumPy 的 shape 就是元组，如 (100, 784)。"],
ex:"p = (3, 4)\nx, y = p → x = 3，y = 4\na, b = 1, 2\na, b = b, a → a = 2，b = 1\nshape = (100, 784)\nrows, cols = shape → rows = 100"});
D("py-set",{a:"集合像一个只收“不同的人”的签到本：同一个人签两次，也只算一次。而且签到本没有顺序，只关心“谁在不在”。",
s:["创建：s = {1, 2, 3} 或 set(列表)。空集合要写 set()，{} 是空字典。","自动去重：set([1, 1, 2]) → {1, 2}。","添加：s.add(x)；删除：s.discard(x)。","判断在不在：x in s，比在列表里找快得多。","交集 a & b，并集 a | b，差集 a − b。","没有下标，不能写 s[0]。"],
ex:"words = ['猫', '狗', '猫', '鱼', '狗']\nset(words) → {'猫', '狗', '鱼'}\nlen(set(words)) → 3 种不同的词\na = {1, 2, 3}，b = {2, 3, 4}\na & b → {2, 3}，a | b → {1, 2, 3, 4}，a − b → {1}"});
D("py-bool",{a:"布尔值就是“是”或“否”的答案。比较运算是提问（“x 大于 3 吗？”），and、or、not 是把几个问题组合起来（“既……又……”“或者……”“不是……”）。",
s:["比较：== 等于（两个等号！一个等号是赋值），!= 不等于，> < >= <=。","and：两边都为 True 才是 True。","or：有一边为 True 就是 True。","not：取反。","Python 支持连写：3 < x < 10。","短路：and 左边已经是 False，右边就不算了；or 左边已经是 True，右边也不算了。"],
ex:"x = 5\nx > 3 → True\nx == 5 and x < 4 → True and False → False\nx < 0 or x > 4 → False or True → True\nnot x > 3 → False\n3 < x < 10 → True"});
D("py-none",{a:"None 就像表格里的“空白格”：不是 0，也不是空字符串，而是“还没有值”。if 判断时，Python 把所有“空的、零的、没有的”东西都当作“否”。",
s:["None 表示没有值。函数没有 return 时，默认返回 None。","判断是不是 None 要用 `is None`，不要用 `== None`。","在 if 里会被当作 False 的：None、0、0.0、''、[]、{}、set()。","其他都当作 True，比如 [0]（有一个元素）、' '（有一个空格）。","所以 `if 列表:` 就能判断列表是不是空的。"],
ex:"def f(x):\n    x + 1        # 忘了写 return\nprint(f(3)) → None\nif []: → 不执行\nif [0]: → 执行（列表不是空的）\nif 0.0: → 不执行"});
D("py-io",{a:"input() 像一个前台接待：拿着一张空白单子请用户填，不管用户写的是数字还是文字，它交给你的永远是一张“字条”（字符串）。要算数，得先换算成数字。",
s:["input('提示文字')：显示提示，等用户输入并回车，返回字符串。","要当数字用必须转换：int(input())、float(input())。","print(a, b, c)：多个值之间默认用空格隔开，最后自动换行。","sep 参数改分隔符，end 参数改结尾（比如 end='' 不换行）。","Jupyter 和 Colab 也支持 input，会弹出一个输入框。"],
ex:"a = input('输入一个数：')   # 用户输入 5\na + 1 → TypeError（字符串不能加数字）\nint(a) + 1 → 6\nprint(1, 2, 3, sep='-') → 1-2-3\nprint('a', end=''); print('b') → ab"});
D("py-if",{a:"if 是一个岔路口的路牌：条件满足走左边，不满足看下一块路牌（elif），全都不满足就走最后一条路（else）。只会走其中一条。",
s:["if 条件: 后面要有冒号。","属于这个条件的代码要缩进 4 个空格。缩进结束就表示这个分支结束。","从上往下检查，第一个为 True 的分支执行后，后面的都跳过。","elif 可以有任意多个，else 最多一个，都可以省略。","缩进不一致会报 IndentationError。"],
ex:"score = 75\nif score >= 90:      → 75 >= 90？否\nelif score >= 60:    → 75 >= 60？是 → 打印“及格”\nelse:                → 不再检查\n注意顺序：如果把 >= 60 写在 >= 90 前面，95 分也会被判成“及格”。"});
D("py-for",{a:"for 像传送带上的分拣员：传送带上的东西一个个经过，每经过一个，分拣员就对它做一遍同样的事，直到传送带上没有东西为止。",
s:["for 变量 in 序列: 每次从序列里取出一个，赋给变量，然后执行缩进的代码。","序列可以是列表、字符串、range、字典等。","range(n)：0, 1, …, n−1，共 n 个。","range(a, b)：a 到 b−1。range(a, b, 步长)：比如 range(0, 10, 2) → 0, 2, 4, 6, 8。","循环结束后，变量保留最后一次的值。"],
ex:"total = 0\nfor x in [3, 5, 2]:\n    total += x\n第 1 次 x = 3，total = 3\n第 2 次 x = 5，total = 8\n第 3 次 x = 2，total = 10\nlist(range(1, 6)) → [1, 2, 3, 4, 5]"});
D("py-zip",{a:"enumerate 像给队伍里每个人发号码牌，你同时知道“第几个”和“是谁”。zip 像拉链，把两排齿（两个列表）一个对一个地扣在一起。",
s:["enumerate(列表) 每次给出 (下标, 元素)。","enumerate(列表, start=1) 让下标从 1 开始。","zip(a, b) 每次给出 (a 的第 i 个, b 的第 i 个)。","长度不同时，zip 以短的为准，多出来的被丢掉。","dict(zip(键列表, 值列表)) 可以直接造出字典。"],
ex:"names = ['小明', '小红']，scores = [90, 85]\nfor i, n in enumerate(names, start=1): → (1, 小明)、(2, 小红)\nfor n, s in zip(names, scores): → (小明, 90)、(小红, 85)\ndict(zip(names, scores)) → {'小明': 90, '小红': 85}"});
D("py-nestloop",{a:"像时钟的分针和时针：时针（外层）走一格，分针（内层）要转完整整一圈。外层循环 3 次、内层循环 4 次，里面的代码一共执行 3 × 4 = 12 次。",
s:["外层循环每执行一次，内层循环就从头到尾完整跑一遍。","内层的范围可以依赖外层变量，比如九九乘法表 range(1, i + 1)。","总次数 = 外层次数 × 内层次数，数据大时会很慢，这也是 NumPy 向量化要解决的。","内层的 break 只跳出内层，不会跳出外层。"],
ex:"for i in range(1, 4):\n    for j in range(1, i + 1):\n        print(j, end=' ')\n    print()\n输出：\n1\n1 2\n1 2 3\ni = 1 内层跑 1 次，i = 2 跑 2 次，i = 3 跑 3 次。"});
D("py-while",{a:"while 像一个看门人：每次都先问“条件还成立吗？”，成立就再干一轮，不成立就收工。break 是“直接下班”，continue 是“这一轮跳过，直接进入下一轮”。",
s:["while 条件: 每一轮开始前检查条件，True 就执行一遍。","循环体里一定要有让条件最终变成 False 的代码，否则就是死循环（按 Ctrl+C 停止）。","break：立即跳出整个循环。","continue：跳过本轮剩下的代码，回到开头检查条件。","不知道要循环几次时用 while，知道次数时用 for。"],
ex:"n = 0\nwhile n < 5:\n    n += 1\n    if n == 2: continue\n    if n == 4: break\n    print(n)\nn = 1：打印 1\nn = 2：continue，不打印\nn = 3：打印 3\nn = 4：break，循环结束\n最终输出 1、3。"});
D("py-func",{a:"函数像一台榨汁机：你放进去水果（参数），按下按钮（调用），它吐出果汁（返回值）。榨汁的过程只需要设计一次，以后想榨多少次都行。",
s:["def 函数名(参数): 定义函数，下面缩进的是函数体。","函数定义时不会执行，只有调用 函数名(值) 时才执行。","return 把结果交回给调用的地方，并立刻结束函数。","没有 return，函数返回 None。","一个函数最好只做一件事，名字用动词，比如 load_data、compute_loss。"],
ex:"def square(x):\n    return x * x\ny = square(3) + square(4)\n调用 square(3)：x = 3，返回 9\n调用 square(4)：x = 4，返回 16\ny = 25"});
D("py-ret",{a:"去餐厅点餐：按位置传参像“老样子，第一个是饮料，第二个是主食”，要记顺序；按名字传参像“饮料要可乐，主食要面”，顺序随便。默认参数像“不说就默认加冰”。",
s:["return a, b 返回一个元组，接收时可以解包：x, y = f()。","位置参数：按顺序对应，f(1, 2)。","关键字参数：按名字对应，f(b=2, a=1)，顺序无所谓。","默认参数：def train(lr=0.01)，调用时不传就用默认值。","规则：位置参数必须写在关键字参数前面；有默认值的参数要放在没默认值的后面。"],
ex:"def train(data, lr=0.01, epochs=10):\n    ...\ntrain(X) → lr = 0.01，epochs = 10\ntrain(X, 0.1) → lr = 0.1，epochs = 10\ntrain(X, epochs=50) → lr = 0.01，epochs = 50\ndef f(): return 1, 2 → a, b = f() → a = 1，b = 2"});
D("py-args",{a:"*args 像一个“来多少收多少”的大口袋，把多出来的位置参数全装进一个元组；**kwargs 是另一个带标签的口袋，把 名字=值 的参数装进一个字典。",
s:["定义时 *args：收集所有多余的位置参数，在函数里是一个元组。","定义时 **kwargs：收集所有多余的关键字参数，在函数里是一个字典。","名字可以随便起，关键是前面的 * 和 **。","调用时反过来也行：f(*列表) 把列表拆开当成多个位置参数，f(**字典) 把字典拆开当成关键字参数。","PyTorch、Matplotlib 很多函数都用 **kwargs 接收一堆可选设置。"],
ex:"def f(*args, **kwargs):\n    print(args, kwargs)\nf(1, 2, 3, lr=0.1, epochs=5)\n→ (1, 2, 3) {'lr': 0.1, 'epochs': 5}\nnums = [3, 1, 2]\nmax(*nums) → 等于 max(3, 1, 2) → 3"});
D("py-scope",{a:"函数像一个房间。房间里写在白板上的东西（局部变量）出了房门就看不到；房间里可以看到走廊上贴的公告（全局变量），但如果在房间里写了一个同名的新白板，那只是房间里的，不会改走廊上的公告。",
s:["在函数里赋值的变量是局部变量，函数结束就消失。","函数里可以读外面的变量（全局变量）。","但如果在函数里对同名变量赋值，就创建了新的局部变量，外面的不变。","真要在函数里修改全局变量，需写 global x（尽量少用）。","好习惯：函数需要什么就用参数传进来，结果用 return 交出去。"],
ex:"count = 0\ndef add():\n    count = count + 1   # 报错 UnboundLocalError\n原因：函数里给 count 赋值，Python 把它当局部变量，但右边读它时它还没有值\n改法：def add(c): return c + 1，然后 count = add(count)"});
D("py-lambda",{a:"lambda 像一张便利贴写的小公式，用完就扔，不值得专门起名字。最常见的用途是告诉 sorted、max 这类函数“按什么标准来比”。",
s:["写法：lambda 参数: 表达式。冒号后面的表达式的值就是返回值。","只能写一个表达式，不能写多行、不能写 if 语句块（可以用 a if 条件 else b）。","最常用：sorted(列表, key=lambda x: ...)。","key 函数对每个元素算一个“比较依据”，按这个依据排序。","复杂的逻辑还是用 def。"],
ex:"students = [('小明', 85), ('小红', 92), ('小刚', 78)]\nsorted(students, key=lambda s: s[1])\n→ [('小刚', 78), ('小明', 85), ('小红', 92)]\nmax(students, key=lambda s: s[1]) → ('小红', 92)\nsorted(students, key=lambda s: -s[1]) → 从高到低"});
D("py-builtin",{a:"内置函数是 Python 自带的一套“随身工具”，不用去仓库（import）拿，打开就能用。",
s:["len(x)：长度。sum(x)、max(x)、min(x)：求和、最大、最小。","abs(x)：绝对值。round(x, n)：保留 n 位小数。","sorted(x)：返回排好序的新列表。reversed(x)：倒序。","type(x)：看类型；isinstance(x, int)：判断是不是某种类型。","list()、dict()、set()、int()、float()、str()：类型转换。","不知道有什么方法时：dir(x) 列出所有方法，help(函数) 看说明。"],
ex:"round(3.14159, 2) → 3.14\nround(2.5) → 2（银行家舍入：.5 时取偶数）\nmax([3, 7, 2]) → 7\nsorted('cba') → ['a', 'b', 'c']\nisinstance(3.0, int) → False"});
D("py-comp",{a:"列表推导式像一句完整的点菜：“把菜单上每道素菜都来一份加辣的”——[加辣(菜) for 菜 in 菜单 if 是素菜]。原本要写四五行的 for 循环，一行说完。",
s:["基本形式：[表达式 for x in 序列]。","带筛选：[表达式 for x in 序列 if 条件]，只保留条件为真的。","读的顺序：先看 for（从哪里取），再看 if（留哪些），最后看最前面（怎么变）。","字典推导式：{k: v for ...}；集合推导式：{x for ...}。","太复杂（嵌套好几层）时还是写普通循环，可读性更重要。"],
ex:"[x * x for x in range(5)] → [0, 1, 4, 9, 16]\n[x for x in range(10) if x % 3 == 0] → [0, 3, 6, 9]\n等价的普通写法：\nresult = []\nfor x in range(10):\n    if x % 3 == 0:\n        result.append(x)\n{w: len(w) for w in ['猫', '老虎']} → {'猫': 1, '老虎': 2}"});
D("py-recur",{a:"俄罗斯套娃：想知道最里面是什么，就打开一层，发现里面还是一个套娃，再打开……直到打开一个实心的（出口）。然后一层层合上回来。",
s:["递归函数在函数体里调用自己，处理一个更小的问题。","必须有出口（基本情况），否则会无限调用，报 RecursionError。","每次调用都要让问题变小，最终到达出口。","计算顺序：先一层层往下“递”到出口，再一层层往上“归”结果。","递归写起来简洁，但深度太大（默认约 1000 层）会出错，这时改用循环。"],
ex:"fact(4)\n= 4 × fact(3)\n= 4 × 3 × fact(2)\n= 4 × 3 × 2 × fact(1)\n= 4 × 3 × 2 × 1（到出口）\n= 24"});
/* 详细讲解：类、模块、文件、NumPy、Matplotlib、Git、怎么写代码 */
D("py-class",{a:"类是一张“学生登记表”的模板，上面有姓名、成绩这些空格；对象是按模板填好的一张张具体的表。self 就是“这张表本身”，方法里写 self.name，意思是“我这张表上的姓名”。",
s:["class 类名: 定义一个类，类名习惯首字母大写。","__init__ 是创建对象时自动执行的“初始化”方法，用来填初始数据。","self.属性 = 值：把数据存到这个对象身上。","方法就是写在类里的函数，第一个参数永远是 self。","创建对象：s = Student('小明')，Python 自动把 s 当作 self 传进去。","调用方法：s.add(90)，等价于 Student.add(s, 90)。"],
ex:"class Student:\n    def __init__(self, name):\n        self.name = name\n        self.scores = []\n    def add(self, s):\n        self.scores.append(s)\na = Student('小明'); b = Student('小红')\na.add(90)\na.scores → [90]，b.scores → []（两张表互不影响）"});
D("py-inherit",{a:"子类像“在父母基础上长大的孩子”：父母会的（方法）孩子天生就会，孩子还可以学新本事，或者用自己的方式做同一件事（改写）。super() 是“先按父母的方式做一遍”。",
s:["class Dog(Animal): 表示 Dog 继承 Animal。","子类自动拥有父类的所有属性和方法。","在子类里写一个同名方法，就会覆盖父类的版本（改写）。","super().__init__(...) 调用父类的初始化，让父类的属性也被设置好。","PyTorch 里每个网络都继承 nn.Module，所以开头一定要写 super().__init__()。"],
ex:"class Animal:\n    def __init__(self, name): self.name = name\n    def speak(self): return '...'\nclass Dog(Animal):\n    def speak(self): return self.name + '：汪'\nd = Dog('旺财')\nd.speak() → '旺财：汪'\nd.name 能用，因为 __init__ 从 Animal 继承来了。"});
D("py-magic",{a:"特殊方法像给对象装上“接口插座”：装了 __len__，len() 就能插进来用；装了 __call__，对象就能像函数一样被“调用”。你写的类就能和 Python 自带的语法无缝配合。",
s:["__init__：创建对象时调用。","__call__：写 obj(x) 时调用。PyTorch 的 model(x) 就是靠它，内部再调用 forward。","__len__：len(obj) 时调用。","__getitem__：obj[i] 时调用。Dataset 就是靠它让 DataLoader 按下标取数据。","__repr__：print(obj) 时显示的内容。","这些方法一般不自己直接调用，而是让 Python 在对应语法时自动调用。"],
ex:"class MyData:\n    def __init__(self, xs): self.xs = xs\n    def __len__(self): return len(self.xs)\n    def __getitem__(self, i): return self.xs[i] * 10\nd = MyData([1, 2, 3])\nlen(d) → 3\nd[1] → 20"});
D("py-module",{a:"模块像工具箱。import numpy as np 是把整个 NumPy 工具箱搬来，并贴上简称 np；from math import sqrt 是只从数学工具箱里拿出开方这一把工具。",
s:["import 模块名：导入整个模块，用时写 模块名.函数。","import 模块名 as 简称：起个短名字，如 np、plt、pd。","from 模块 import 函数：只导入某个函数，用时直接写函数名。","自己写的 utils.py 放在同一个文件夹里，就能 import utils。","尽量不要写 from 模块 import *，会分不清函数从哪来，还可能覆盖同名函数。"],
ex:"import math\nmath.sqrt(16) → 4.0\nfrom math import sqrt, pi\nsqrt(16) → 4.0，pi → 3.14159…\n同一个文件夹里有 my_tools.py，里面有 def add(a, b)\nimport my_tools → my_tools.add(1, 2) → 3"});
D("py-main",{a:"一个 .py 文件有两种身份：被“直接运行”时它是主角，被别人 import 时它是“工具箱”。这句判断就是在问“我现在是主角吗？”，是主角才去执行训练、打印这些主流程。",
s:["每个文件都有一个自动变量 __name__。","直接运行 python a.py 时，a.py 里的 __name__ 等于 '__main__'。","被别的文件 import a 时，a.py 里的 __name__ 等于 'a'。","所以 if __name__ == '__main__': 下面的代码只在直接运行时执行。","好处：同一个文件既能当脚本运行，又能被 import 复用里面的函数，不会一导入就开始训练。"],
ex:"tools.py：\ndef add(a, b): return a + b\nif __name__ == '__main__':\n    print(add(1, 2))\npython tools.py → 打印 3\n在 main.py 里 import tools → 什么也不打印，只是能用 tools.add"});
D("py-pip",{a:"pip 像手机的应用商店：pip install 名字 就是下载安装一个 App。Anaconda 像一台预装了常用 App 的新手机，开机就能用 NumPy、Matplotlib。",
s:["在终端（不是 Python 里）运行：pip install numpy。","pip list 看装了哪些包；pip show 包名 看版本。","pip install -U 包名 升级。","在 Jupyter / Colab 的格子里要加感叹号：!pip install 包名。","import 报 ModuleNotFoundError 时，通常就是没装，或者装到了另一个 Python 环境里。"],
ex:"import torch → ModuleNotFoundError: No module named 'torch'\n解决：在终端运行 pip install torch\nColab 里：!pip install torch\n再 import torch 就成功了。"});
D("py-path",{a:"Python 找模块像你找钥匙：只在几个固定的地方翻（sys.path 列表里的文件夹）。鱼书的代码在 ch03 文件夹里，而 dataset 文件夹在上一级，所以要先把上一级加进“找钥匙的地方”。",
s:["import 时，Python 依次在 sys.path 里的每个文件夹找同名的 .py 文件或文件夹。","sys.path 默认包含：当前脚本所在的文件夹、Python 安装的库目录。","os.pardir 就是 '..'，表示上一级目录。","sys.path.append(os.pardir) 把上一级目录加进搜索列表。","之后 from dataset.mnist import load_mnist 才能找到 ../dataset/mnist.py。"],
ex:"文件结构：\ndeep-learning-from-scratch/\n├── dataset/mnist.py\n└── ch03/neuralnet_mnist.py\n在 ch03 里直接 from dataset.mnist import … → 找不到\n先 sys.path.append('..') → 能找到了\n注意：要在 ch03 文件夹里运行，相对路径才对。"});
D("py-file",{a:"with open() 像借书：借出（打开）、看或写、自动归还（关闭）。with 保证就算中途出错，书也一定会还回去。json 是一种通用的“书写格式”，把列表和字典写成文本，下次能原样读回。",
s:["open(文件名, 模式, encoding='utf-8')：'r' 读，'w' 写（会清空），'a' 追加。","with ... as f: 缩进结束时自动关闭文件。","读：f.read() 读全部；for line in f: 一行行读。","写：f.write('内容\\n')，记得自己加换行。","json.dump(数据, f, ensure_ascii=False) 保存；json.load(f) 读回。中文要加 ensure_ascii=False 才不会变成乱码。"],
ex:"import json\nnotes = {'ML 1-1': '监督学习有标签'}\nwith open('notes.json', 'w', encoding='utf-8') as f:\n    json.dump(notes, f, ensure_ascii=False)\nwith open('notes.json', encoding='utf-8') as f:\n    back = json.load(f)\nback['ML 1-1'] → '监督学习有标签'"});
D("py-pickle",{a:"json 只能存“通用格式”的东西（数字、文字、列表、字典），pickle 像真空压缩袋，任何 Python 对象（包括 NumPy 数组、自己写的类）都能原样压进去，打开还是原来的样子。",
s:["保存：with open('x.pkl', 'wb') as f: pickle.dump(对象, f)。注意是 'wb'（二进制写）。","读取：with open('x.pkl', 'rb') as f: 对象 = pickle.load(f)。","鱼书的 sample_weight.pkl 就是训练好的权重字典，读出来直接能用。","pickle 文件只有 Python 能读，不同版本之间偶尔不兼容。","安全提醒：不要打开来路不明的 .pkl 文件，加载时可能执行恶意代码。"],
ex:"import pickle, numpy as np\nparams = {'W1': np.ones((2, 3)), 'b1': np.zeros(3)}\nwith open('params.pkl', 'wb') as f: pickle.dump(params, f)\nwith open('params.pkl', 'rb') as f: p = pickle.load(f)\np['W1'].shape → (2, 3)"});
D("py-except",{a:"try / except 像走钢丝时下面挂的安全网：上面（try）正常走，一旦掉下来（出错），网（except）接住你，告诉你怎么处理，而不是直接摔死（程序崩溃）。",
s:["把可能出错的代码放进 try:。","出错时跳到对应的 except 错误类型: 执行处理代码，程序继续往下走。","可以写多个 except 处理不同错误：ValueError（值不对）、KeyError（键不存在）、FileNotFoundError（找不到文件）等。","else：没出错时执行；finally：不管出没出错都执行。","不要写空的 except: pass，它会把所有错误都吞掉，出了问题你也不知道。"],
ex:"while True:\n    try:\n        n = int(input('金额：'))\n        break\n    except ValueError:\n        print('请输入数字')\n用户输入 abc → int('abc') 出错 → 打印“请输入数字”，再问一次\n用户输入 25 → 成功，break 跳出"});
D("np-why",{a:"用 Python 列表算一百万个数的平方，像一个人拿计算器按一百万次；用 NumPy，像把整张表交给一台机器一次性算完。NumPy 底层是用 C 语言写的，而且数据在内存里紧挨着放，所以快得多。",
s:["Python 的 for 循环每一步都要检查类型、解释执行，很慢。","NumPy 数组里所有元素类型相同、连续存放，计算交给编译好的 C 代码一次完成。","写法也更简单：x * 2 就是每个元素乘 2，不用写循环。","神经网络的计算就是大量矩阵运算，所以鱼书从第 1 章就开始用 NumPy。","PyTorch 的张量用法和 NumPy 几乎一样，学会 NumPy 就学会了一大半。"],
ex:"一百万个数求平方和：\n列表：sum([x * x for x in lst]) → 约 0.1 秒\nNumPy：(arr ** 2).sum() → 约 0.002 秒\n快了大约 50 倍，数据越大差距越明显。"});
D("np-create",{a:"建数组像准备一个格子本：可以照抄一份已有的数（np.array），也可以直接领一本全是 0 的（zeros）、全是 1 的（ones），或者按规律填好的（arange、linspace）。",
s:["np.array(列表)：从列表创建。嵌套列表就是二维数组。","np.zeros(形状)、np.ones(形状)：全 0、全 1。形状写成元组，如 (2, 3)。","np.arange(开始, 结束, 步长)：像 range，但能用小数步长，不含结束。","np.linspace(开始, 结束, 个数)：在区间内均匀取指定个数的点，含结束。","np.eye(n)：n×n 单位矩阵。np.zeros_like(x)：和 x 形状一样的全 0 数组（鱼书算梯度时常用）。"],
ex:"np.arange(0, 1, 0.25) → [0.   0.25 0.5  0.75]\nnp.linspace(0, 1, 5) → [0.   0.25 0.5  0.75 1.  ]\nnp.zeros((2, 3)) → 2 行 3 列的 0\nnp.eye(2) → [[1. 0.] [0. 1.]]"});
D("np-astype",{a:"astype 像换单位：同样的东西，从“个”换成“小数”，或者从“真假”换成“1 和 0”。换完是一个新的数组，原来的不变。",
s:["每个数组都有一个 dtype：int64、float64、float32、bool 等。","x.astype(新类型) 返回转换后的新数组。","bool → int：True 变 1，False 变 0。鱼书的阶跃函数就是 (x > 0).astype(int)。","float → int：直接砍掉小数部分。","图片像素通常是 uint8（0～255），训练前要转成 float32 再除以 255，变成 0～1。"],
ex:"x = np.array([-1.0, 0.5, 2.0])\n(x > 0) → [False  True  True]\n(x > 0).astype(int) → [0 1 1]\nnp.array([2.7, -2.7]).astype(int) → [ 2 -2]\nnp.array([0, 128, 255], dtype=np.uint8).astype(np.float32) / 255 → [0. 0.502 1.]"});
D("np-shape",{a:"shape 像一个箱子的规格说明：(3, 2) 是“3 层，每层 2 格”。深度学习里大部分报错都是规格对不上，就像想把 A4 纸塞进信封，尺寸不对就是塞不进。",
s:["A.shape：每个维度有多长，返回元组。","A.ndim：有几个维度，就是 shape 的长度。","A.dtype：元素的类型。","A.size：元素总个数，等于 shape 各项相乘。","一维数组 shape 是 (3,)，不是 (3, 1) 也不是 (1, 3)，这点经常引起混淆。","写代码时养成习惯：在注释里标出每个变量的形状。"],
ex:"A = np.array([[1, 2], [3, 4], [5, 6]])\nA.shape → (3, 2)，A.ndim → 2，A.size → 6\nx = np.array([1, 2, 3])\nx.shape → (3,)\nMNIST 一批数据：X.shape → (100, 784)，100 张图，每张 784 个像素"});
D("np-elem",{a:"逐元素运算像两排人一对一握手：第 1 个和第 1 个、第 2 个和第 2 个……各算各的。它不是矩阵乘法，矩阵乘法是一个人要和对面一整列的人都打交道。",
s:["形状相同的两个数组，+ − * / ** 都是对应位置分别计算。","np.exp(x)、np.log(x)、np.sqrt(x) 这类函数也是对每个元素分别计算。","x * y 是逐元素乘法，矩阵乘法要用 x @ y 或 np.dot。","形状不同会尝试广播，不能广播就报错。","sigmoid 就是一行逐元素运算：1 / (1 + np.exp(-x))。"],
ex:"x = np.array([1., 2., 3.])\ny = np.array([2., 4., 6.])\nx + y → [3. 6. 9.]\nx * y → [ 2.  8. 18.]\ny / x → [2. 2. 2.]\n1 / (1 + np.exp(-np.array([0., 2.]))) → [0.5   0.881]"});
D("np-dot",{a:"矩阵乘法像“打分”：每个学生（A 的一行）拿着自己各科的成绩，和每套权重方案（B 的一列）逐科相乘再加起来，得到一个总分。所以 A 的“科目数”（列数）必须等于 B 的“科目数”（行数）。",
s:["A 形状 (m, n)，B 形状 (n, p)，A @ B 形状 (m, p)。中间的 n 必须相等，相当于“消掉”。","结果第 i 行第 j 列 = A 的第 i 行和 B 的第 j 列对应相乘再求和。","神经网络一层：X @ W + b，X 是 (批大小, 输入数)，W 是 (输入数, 输出数)。","形状不匹配会报错：shapes (2,3) and (2,3) not aligned。","一维数组之间 np.dot(a, b) 是内积，结果是一个数。"],
ex:"A = [[1, 2],\n     [3, 4]]   (2, 2)\nB = [[5, 6],\n     [7, 8]]   (2, 2)\n(A @ B)[0][0] = 1×5 + 2×7 = 19\n(A @ B)[0][1] = 1×6 + 2×8 = 22\nA @ B = [[19, 22], [43, 50]]\n形状检查：(100, 784) @ (784, 50) → (100, 50)"});
D("np-bc",{a:"广播像老师给全班发通知：不需要给每个人单独写一份，写一份，自动“复印”给每个人。小数组会被自动复制扩展成大数组的形状，再逐元素计算。",
s:["数和数组：A * 10，10 被扩展成和 A 一样的形状。","规则：从最后一个维度开始往前对齐比较。","每一对维度要么相等，要么其中一个是 1（或者不存在），才能广播。","长度为 1 的那个维度会被复制扩展。","最常用的地方：X @ W + b，b 的形状 (50,) 被广播到 (100, 50)，每一行都加上同一个 b。"],
ex:"A = [[1, 2],\n     [3, 4]]   (2, 2)\nb = [10, 20]   (2,)\nA + b → b 被扩展成 [[10, 20], [10, 20]]\n→ [[11, 22], [13, 24]]\n(3, 1) 和 (1, 4) 相加 → (3, 4)\n(2, 3) 和 (2,) → 最后一维 3 和 2 不等，报错"});
D("np-index",{a:"二维数组像电影院的座位表：A[2, 5] 是“第 2 排第 5 座”；A[2, :] 是“第 2 排所有座位”；A[:, 5] 是“每一排的第 5 座”。冒号就是“这一维全都要”。",
s:["A[i, j]：第 i 行第 j 列（都从 0 开始）。","A[i] 或 A[i, :]：整个第 i 行。","A[:, j]：整个第 j 列。","切片和列表一样：A[0:2, 1:] 取第 0、1 行，第 1 列到最后。","花式索引：A[[0, 2]] 取第 0 行和第 2 行。","鱼书里常见：y[np.arange(batch), t] 一次从每行取出正确标签对应的那个概率。"],
ex:"X = [[51, 55],\n     [14, 19],\n     [ 0,  4]]\nX[1, 0] → 14\nX[:, 1] → [55 19 4]\nX[0:2] → [[51 55] [14 19]]\ny = [[0.1, 0.9], [0.8, 0.2]]，t = [1, 0]\ny[[0, 1], t] → [0.9 0.8]"});
D("np-bool",{a:"布尔索引像用筛子筛沙子：先做一个和数组一样大的筛子（每格写“要”或“不要”），再把数组倒进去，只留下“要”的那些格子。",
s:["X > 15 对每个元素做比较，得到同形状的 True/False 数组（筛子）。","X[筛子] 只取出 True 位置的元素，结果是一维数组。","多个条件用 & 和 |，每个条件要加括号：X[(X > 5) & (X < 20)]。","也可以用来赋值：X[X < 0] = 0，把负数全变 0（就是 ReLU）。","计数：(X > 15).sum() 统计有多少个满足条件，因为 True 当作 1。"],
ex:"X = np.array([51, 55, 14, 19, 0, 4])\nX > 15 → [T T F T F F]\nX[X > 15] → [51 55 19]\n(X > 15).sum() → 3\n准确率：(pred == label).mean()\npred = [1, 2, 3]，label = [1, 0, 3] → [T F T].mean() → 0.667"});
D("np-axis",{a:"一张成绩表，每行一个学生，每列一科。axis=0 是“沿着行往下压”，把所有学生压成一行，得到每科的统计；axis=1 是“沿着列往右压”，把所有科目压成一列，得到每个学生的统计。",
s:["axis=0：跨行计算，结果每列一个值，形状去掉第 0 维。","axis=1：跨列计算，结果每行一个值，形状去掉第 1 维。","记法：axis 等于几，就是把那一维“压扁消失”。","sum、mean、max、argmax 都能用 axis。","分类网络输出 (批大小, 类别数)，np.argmax(y, axis=1) 得到每张图预测的类别。"],
